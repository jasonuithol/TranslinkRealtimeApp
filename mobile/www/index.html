  <div class="goose"><svg viewBox="440 -1740 1720 2080"><use href="#goose-shape"/></svg></div>
  <h1>Transport Honker</h1>
  <p>The goose that knows when your bus is coming. Offline city packs are
     in development — this is the packaging test shell.</p>
  <button id="honk">HONK</button>
  <button id="geo">where am I?</button>
  <div id="out"></div>
<script>
  // Two native smoke tests: bundled-asset audio, and the platform's
  // geolocation permission flow (the packaged app is a secure context).
  const honk = new Audio("sounds/honk.mp3");
  document.getElementById("honk").addEventListener("click", () => {
    honk.currentTime = 0;
    honk.play().catch((e) => out.textContent = "audio: " + e.message);
  });
  const out = document.getElementById("out");
  document.getElementById("geo").addEventListener("click", () => {
    out.textContent = "asking…";
    navigator.geolocation.getCurrentPosition(
      (p) => out.textContent =
        p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5)
        + "  (±" + Math.round(p.coords.accuracy) + " m)",
      (e) => out.textContent = "geo: " + e.message,
      { enableHighAccuracy: true, timeout: 15000 });
  });
</script>
