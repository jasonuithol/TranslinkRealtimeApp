<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Packaged-app shim: the UI is bundled, the data is not (yet). Any
// absolute /api or /basemap request is sent to the API host; everything
// else — /static/... — resolves inside the app bundle.
(function () {
  var BASE = "https://nextarrival.app";
  var REMOTE = /^\/(api|basemap)\//;
  function remap(u) {
    try {
      var p = new URL(u, location.href);
      if (p.origin === location.origin && REMOTE.test(p.pathname)) {
        return BASE + p.pathname + p.search;
      }
    } catch (e) { /* not a URL we can parse: leave it alone */ }
    return u;
  }
  var orig = window.fetch.bind(window);
  window.fetch = function (input, init) {
    if (typeof input === "string") return orig(remap(input), init);
    if (input && input.url) {
      var m = remap(input.url);
      if (m !== input.url) return orig(new Request(m, input), init);
    }
    return orig(input, init);
  };
})();
</script>

<main>

  <header>
    <!-- No region row: the region is implicit — search results carry their
         state, and panning the map far enough swaps regions by itself. -->
    <!-- Only once a stop is chosen; before that the name would just say
         "Next service", which costs a line and tells you nothing. -->
    <div class="titlebar" id="titlebar" hidden>
      <a class="home-goose" id="home-goose" href="/" title="Home page"
         aria-label="Home page"><svg viewBox="440 -1740 1720 2080" aria-hidden="true"><use href="#goose-shape"/></svg></a>
      <h1 id="stop-name"></h1>
      <!-- Pinned browse only: the goose rides ON the button — one control,
           home to the landing with the typed query ready to fix. -->
      <button class="change" id="change-stop" type="button"><svg viewBox="440 -1740 1720 2080" aria-hidden="true"><use href="#goose-shape"/></svg>Change address</button>
      <button class="change" id="plan-to" type="button" hidden></button>
      <span class="tzbadge" id="tz-badge" hidden><span class="tz-icon"
        aria-hidden="true">&#x1F310;&#xFE0E;</span><span id="tz-abbr"></span></span>
    </div>
  </header>

  <!-- The shell's first frame: a waddling goose while we find you, the
       region loads and the map warms. Hidden the moment the map is up. -->
  <div class="boot" id="boot">
    <div class="boot-goose"><svg viewBox="440 -1740 1720 2080" aria-hidden="true"><use href="#goose-shape"/></svg></div>
    <div class="boot-say" id="boot-say">Finding you…</div>
    <!-- Only after a long wait, or a refusal: the rider says where they are
         instead. Until then there is no map behind this, because we do not
         yet know which city to show and guessing looks worse than waiting. -->
    <button class="boot-alt" id="boot-alt" type="button" hidden>
      Search for an address instead
    </button>

    <!-- Asking for a region's data, and then downloading it. Lives inside
         the boot screen: it is the last thing between a cold start and a
         working app. -->
    <div class="pk" id="pk" hidden>
      <div class="pk-title" id="pk-title"></div>
      <div class="pk-body" id="pk-body"></div>
      <!-- The meter, with a goose walking the distance for you. -->
      <div class="meter" id="pk-meter" hidden>
        <div class="meter-track"><div class="meter-fill" id="pk-fill"></div></div>
        <span class="meter-goose" id="pk-goose">
          <svg viewBox="440 -1740 1720 2080" aria-hidden="true"><use href="#goose-shape"/></svg>
        </span>
      </div>
      <div class="pk-say" id="pk-say"></div>
      <div class="pk-btns" id="pk-btns"></div>
    </div>
  </div>

  <!-- The workflow, left to right: where you are, where you're going, then
       one button per journey. Floats over the map; the page never scrolls. -->
  <div class="toolbar" id="toolbar" hidden>
    <button class="tb tb-home" id="tb-home" type="button"
            title="Where you are — tap to search, drag onto the map to place"
            aria-label="Where you are. Tap to search, or drag onto the map.">
      <svg viewBox="440 -1740 1720 2080" aria-hidden="true"><use href="#goose-shape"/></svg>
    </button>
    <span class="tb-slot" id="tb-target-slot"></span>
    <div class="tb-solutions" id="tb-solutions"></div>
    <span class="tzbadge" id="tz-badge2" hidden></span>
    <!-- Last, and deliberately so: the workflow reads left to right and
         settings are not a step in it. -->
    <button class="tb tb-menu" id="tb-menu" type="button"
            title="Settings" aria-label="Settings">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </div>

  <!-- Settings: what the app is holding, and how to be rid of it. -->
  <div class="sheet" id="settings" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button class="sheet-x" id="settings-x" type="button"
                aria-label="Close settings">&times;</button>
      </div>
      <div class="sheet-body" id="settings-body"></div>
    </div>
  </div>

  <!-- Landing logo; only visible while no stop is chosen. -->
  <div id="hero">
    <div class="goose" role="img" aria-label="Next Service"><svg viewBox="440 -1740 1720 2080" aria-hidden="true"><use href="#goose-shape"/></svg></div>
  </div>

  <div class="search" id="search-wrap">
    <div class="search-row">
      <div class="search-field">
        <input id="search" type="search"
               placeholder="Search for a stop or an address"
               autocomplete="off" aria-label="Search for a stop or an address">
      </div>
      <button class="near-me" id="near-me" type="button"
              title="Find stops near your current location">near me</button>
      <!-- Last segment of the one control: closes the whole thing. -->
      <button class="search-close" id="search-close" type="button"
              aria-label="Close search" hidden>&times;</button>
    </div>
    <div class="search-results" id="results" hidden></div>
  </div>

  <!-- One overlay, two tenants: a stop's arrivals (tap a stop) or a
       journey card (hold a solution button). Both render into #board. -->
  <div class="ov" id="ov" hidden>
    <button class="ov-x" id="ov-x" type="button" aria-label="Close">&times;</button>
    <div class="board" id="board">
      <div class="empty placeholder">
        <div>Select a stop to see departures.</div>
        <div class="ph-icon">&#x1F570;&#xFE0E;</div>
      </div>
    </div>
  </div>

  <div class="split" id="split">
    <div id="map-wrap" class="awaiting" hidden>
      <div id="map"></div>
      <!-- Off-screen board vehicles, pinned to the map edge nearest to them. -->
      <div id="edge-markers" aria-hidden="true"></div>
      <div class="map-empty placeholder" id="map-empty">
        <div>Search for a stop to see it on the map.</div>
        <div class="ph-icon">&#x1F30F;&#xFE0E;</div>
      </div>
      <!-- `awaiting` is dropped by selectStop, which then resizes the map. -->
      <div class="map-caption" id="map-caption" hidden>
        <span id="map-status">live vehicle positions</span>
        <span class="hint">click a service to show its route</span>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <!-- Disruption details, opened from a row's ⚠ mark. -->
  <div class="alert-modal" id="alert-modal" hidden>
    <div class="alert-box" id="alert-box" role="dialog" aria-label="Service disruptions"></div>
  </div>
</main>
