<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Service</title>
<link href="/static/fonts/fonts.css?v=3" rel="stylesheet">
<link href="/static/vendor/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --board: #101418;        /* board casing */
    --panel: #171d23;        /* row panel */
    --line:  #232c34;
    --amber: #ffb400;        /* LED amber, the busway PID colour */
    --amber-dim: #7a5a10;
    --text:  #e8edf1;
    --muted: #8fa0ad;
    --live:  #35d07f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--board);
    color: var(--text);
    font-family: "Archivo", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  /* Narrow by default (board only). Widens once the map is alongside, using
     most of the viewport so a wide monitor isn't mostly empty margin. */
  main { width: 100%; max-width: 620px; }
  main.wide { max-width: min(1760px, 96vw); }

  header { margin-bottom: 20px; }
  .titlebar {
    display: flex; align-items: baseline; gap: 12px;
    flex-wrap: wrap; margin-top: 2px;
  }
  .titlebar[hidden] { display: none; }
  .change {
    background: none; border: 2px solid var(--amber); border-radius: 999px;
    color: var(--text); font: inherit; font-size: 18px;
    padding: 4px 18px; cursor: pointer; white-space: nowrap;
  }
  .change:hover { background: var(--amber); color: #000; }
  .change:focus-visible { outline: 2px solid var(--amber-dim); outline-offset: 2px; }
  /* Every time on the page is the network's wall clock, and six networks now
     span three Australian timezones — say which one, pinned to the right
     edge of the titlebar with a monochrome globe for "timezone". */
  .tzbadge {
    margin-left: auto;               /* right-justified in the flex titlebar */
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-size: 16px; letter-spacing: 0.06em;
    padding: 3px 14px; white-space: nowrap;
  }
  .tzbadge[hidden] { display: none; }
  .tzbadge .tz-icon {
    font-family: "Noto Emoji", system-ui, sans-serif;   /* monochrome face */
    font-size: 18px;
  }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.25; }
  /* The little goose flies you home — back to the landing and its search.
     Same amber ink as the hero bird. */
  .home-goose {
    color: var(--amber); text-decoration: none;
    align-self: center;
  }
  .home-goose svg { height: 26px; display: block; }
  .home-goose:hover svg { filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.55)); }
  .home-goose:focus-visible { outline: 2px solid var(--amber-dim); outline-offset: 2px; }

  .search { position: relative; margin-bottom: 22px; }
  .search[hidden] { display: none; }
  .search-row { display: flex; gap: 10px; }
  .search-field { position: relative; flex: 1; }
  .near-me {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted); font: inherit; font-size: 13px; white-space: nowrap;
    padding: 0 16px; cursor: pointer;
  }
  .near-me[hidden] { display: none; }
  .near-me:hover { color: var(--text); border-color: var(--amber-dim); }
  .near-me:focus-visible { outline: 2px solid var(--amber-dim); outline-offset: 2px; }
  .search-close {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--muted);
    font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer;
  }
  .search-close:hover { color: var(--text); }
  .search-close[hidden] { display: none; }
  /* Keep typed text clear of the close button. */
  .search-field:has(.search-close:not([hidden])) input { padding-right: 42px; }
  .search input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
  }
  .search input:focus { border-color: var(--amber-dim); }
  .search-results {
    position: absolute; inset-inline: 0; top: calc(100% + 4px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    /* Never past the bottom of the screen: fitResults() measures the real
       gap to the viewport edge and tightens this; the vh value is only the
       pre-measurement fallback. Overflow scrolls inside the dropdown. */
    max-height: 45vh; overflow-y: auto;
    z-index: 10;
  }
  .search-results button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: none; border: 0; color: var(--text);
    font: inherit; font-size: 14px;
    padding: 10px 14px; cursor: pointer;
  }
  .search-results button:hover, .search-results button:focus-visible {
    background: #1f2731; outline: none;
  }
  .search-results .rmain {
    flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* A stop result carries its stop glyph, pinned to the row's right edge. */
  .search-results .ricon {
    flex: none; margin-left: auto;
    font-family: "Noto Emoji", system-ui, sans-serif;
    font-variant-emoji: text;
    font-size: 20px; line-height: 1; color: var(--muted);
  }
  .search-results .sid {
    font-family: "IBM Plex Mono", monospace;
    color: var(--muted); font-size: 12px; margin-left: 6px;
  }

  /* Journey-planner itinerary cards. */
  .itin {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin: 0 0 10px;
    cursor: pointer;
  }
  .itin:hover { border-color: var(--amber-dim); }
  .itin.selected { border-color: var(--amber); background: var(--panel); }
  .itin .it-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .itin .it-times { font-weight: 700; font-size: 16px; }
  .itin .it-sub { color: var(--muted); font-size: 12px; }
  .itin .it-risk {
    color: #e5484d; font-size: 12px;
    font-family: "IBM Plex Mono", monospace;
  }
  /* Legs reuse the arrivals row's parts (.badge/.mode/.num/.src-col) so the
     two boards speak one visual language — only the layout shell differs. */
  .itin { position: relative; }
  .itin .it-leg {
    display: flex; gap: 12px; align-items: center;
    padding: 5px 0; font-size: 13px;
    border-left: 3px solid var(--vcolor); padding-left: 10px;
  }
  .itin .it-detail {
    display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;
    color: var(--vcolor);   /* the route description speaks its leg colour */
  }
  /* Departure time in its own right-aligned column, leg-coloured. */
  .itin .it-times2 {
    display: flex; flex-direction: column; gap: 2px; flex: none;
    align-items: flex-end; min-width: 46px;
    font-family: "IBM Plex Mono", monospace; font-size: 13px;
    color: var(--vcolor);
  }
  /* The journey's arrival: one dedicated row under the legs, plain ink. */
  .itin .it-arrive {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0 0 10px; margin-top: 2px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .itin .it-arrive b {
    font-family: "IBM Plex Mono", monospace; color: var(--text);
  }
  /* Countdown to set-off, top right — same object as an arrivals row's.
     In the header row's flow (margin-left:auto), so it can never collide
     with the leg time columns below. */
  .itin .it-eta { margin-left: auto; align-self: flex-start; }
  .itin.started { border-color: #2ecc71; }
  .itin .it-actions { display: flex; justify-content: center; margin-top: 8px; }
  .itin .it-start {
    background: none; border: 2px solid var(--amber); border-radius: 999px;
    color: var(--text); font: inherit; font-size: 18px; font-weight: 700;
    padding: 5px 34px; cursor: pointer;
  }
  .itin .it-start:hover { background: var(--amber); color: #000; }
  .itin .it-start.remove { color: #e5484d; border-color: #e5484d; }
  .itin .it-start.remove:hover { background: #e5484d; color: #000; }

  /* The stop the arrivals belong to: glyph + name atop the board. */
  .board-head {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px;
    padding: 2px 6px 10px; margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  /* Monochrome, bright white — the exact ink of the viewed-stop marker on
     the map (LANDMARK_SELECTED_INK), so heading and marker read as one.
     The Noto Emoji face is what makes it monochrome: without it, browsers
     that ignore VS15 (Chrome) substitute the system COLOUR emoji font. */
  .board-head .bh-icon {
    font-size: 18px; color: #ffffff;
    font-family: "Noto Emoji", system-ui, sans-serif;
  }

  /* --- landing ----------------------------------------------------------- */
  /* First load, before any stop is chosen: nothing but the logo and the
     search. The board/map split is NOT display:none-d — MapLibre needs a
     sized container at construction or it never fires 'load' — it is parked
     off-screen, still sized, so the map warms up underneath the landing. */
  body.landing header, body.landing .status { display: none; }
  body.landing #split {
    position: fixed; left: -200vw; top: 0;
    width: min(1200px, 96vw);
    visibility: hidden; pointer-events: none;
  }
  body.landing .search { max-width: 560px; margin: 0 auto; }
  #hero { display: none; }
  body.landing #hero {
    display: flex; flex-direction: column; align-items: center;
    margin: max(14vh, 48px) 0 34px;
  }
  /* The goose: the emoji glyph's own outlines, lifted from the subset font
     into an inline SVG so the body can take a solid fill — green under the
     gold line art (green and gold, for Australia). Same shape everywhere,
     no colour-emoji font roulette. drop-shadow glows where text-shadow
     can't reach an SVG. */
  #hero .goose { color: var(--amber); }
  #hero .goose svg {
    height: 96px; display: block;
    filter: drop-shadow(0 0 28px rgba(255, 180, 0, 0.35));
  }
  .goose-body { fill: #00843d; }   /* Australian national green */

  .board {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: grid;
    /* badge | destination | time-source + alerts | countdown */
    grid-template-columns: 130px 1fr 64px 96px;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }

  /* Split badge: mode glyph | route number. Black plate, white border and
     divider; the glyph and the number both inherit the vehicle colour via
     `color`, so the badge matches the row stripe and the map marker. */
  .badge {
    justify-self: start;
    display: inline-flex;
    align-items: stretch;
    background: #000;
    border: 1px solid #fff;
    border-radius: 8px;
    overflow: hidden;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .badge .mode {
    display: flex; align-items: center; justify-content: center;
    padding: 6px 9px;
    border-right: 1px solid #fff;
  }
  /* Noto Emoji is monochrome, so the glyph inherits the badge's `color`.
     Listing it first means only these codepoints come from it. */
  .badge .mode {
    font-family: "Noto Emoji", "Archivo", system-ui, sans-serif;
    font-size: 22px;
    /* Belt and braces with the U+FE0E in the markup: newer engines honour this
       property, older ones only the variation selector. Both say the same
       thing — render these as text, not as colour emoji. */
    font-variant-emoji: text;
  }
  .badge .num {
    display: flex; align-items: center; justify-content: center;
    padding: 6px 10px; font-size: 22px; min-width: 48px;
  }
  .badge .num.wide { font-size: 15px; line-height: 1.15; padding: 6px 8px; }
  /* Named lines (Melbourne trains: "Williamstown") rather than numbers: clamp
     to the badge column instead of spilling into the destination. */
  .badge .num.xwide {
    font-size: 11px; line-height: 1.1; padding: 6px 6px;
    max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: block; align-content: center;
  }
  .dest { min-width: 0; }
  .dest .headsign {
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dest .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Every service carries its own colour — that is its identity, and it must
     not change as the service gains or loses a live position. */
  .row { border-left: 3px solid var(--vcolor); padding-left: 13px; }
  /* Any row can be picked to draw its route. */
  .row { cursor: pointer; }
  .row:hover { background: #1c242d; }
  .row:focus-visible { outline: 2px solid var(--vcolor); outline-offset: -2px; }
  /* The service whose route is currently drawn. */
  .row.selected {
    background: color-mix(in srgb, var(--vcolor) 14%, var(--panel));
    border-left-width: 6px; padding-left: 10px;
  }
  /* Flashed when its marker is clicked on the map, in its own colour so the
     pairing is unambiguous. */
  .row.flash { animation: rowflash 0.73s ease-in-out 3; }
  @keyframes rowflash {
    50% { background: color-mix(in srgb, var(--vcolor) 24%, var(--panel)); }
  }
  /* Trip stop-list: when a service is selected its full calling pattern
     overlays the arrivals list, leaving the badge column visible so the
     board still reads as a board. The thick line down the left is the same
     route trace the map draws, in the same colour; each stop is a station
     dot on it. */
  .board { position: relative; }
  .trip-panel {
    position: absolute; inset: 0 0 0 160px;   /* clear of the badge column */
    /* top is set inline to sit just below the board heading (its height
       varies with name wrapping) — this is only the no-heading fallback. */
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    z-index: 5;
  }
  .tp-head {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .tp-head .tp-dest {
    color: var(--text); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* 🛜/📅 beside the badge — the board's source column, relocated here
     while the panel covers it. */
  .tp-head .tp-src {
    font-family: "Noto Emoji", system-ui, sans-serif;
    font-variant-emoji: text;
    font-size: 18px; color: var(--vcolor); flex: none;
  }
  .tp-close {
    margin-left: auto; flex: none;
    background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    padding: 2px 6px;
  }
  .tp-close:hover { color: var(--text); }
  .tstops {
    flex: 1; overflow-y: auto;
    margin: 10px 14px 10px 24px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  /* The line, its dots and the vehicle markers all live INSIDE the scroll
     content (a border-left on the scroll container clipped anything hung
     off it to a sliver). The track is the positioning context. */
  /* Height follows the stops, not the panel: the line must END at the
     terminus, not run on to the panel floor when the panel is taller. */
  .ttrack { position: relative; padding: 4px 0 4px 30px; }
  .ttrack::before {                   /* the route line, full list height */
    content: ""; position: absolute; left: 9px; top: 0; bottom: 0;
    width: 6px; background: var(--vcolor);
  }
  .tstop {
    position: relative;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; padding: 5px 0; font-size: 13px;
  }
  .tstop::before {                    /* station dot, centred on the line */
    content: ""; position: absolute; left: -18px; top: 50%;
    width: 8px; height: 8px; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--panel);
    border: 2px solid var(--vcolor);
  }
  /* A live vehicle, sitting on the line at its position along the run.
     Same recipe as the badge: black plate, glyph in the service colour. */
  .tveh {
    position: absolute; left: 12px; transform: translate(-50%, -50%);
    width: 24px; height: 24px; border-radius: 50%;
    background: #000; border: 2px solid var(--vcolor);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Emoji", system-ui, sans-serif;
    font-variant-emoji: text; font-size: 13px; line-height: 1;
    color: var(--vcolor);
    pointer-events: none; z-index: 2;
  }
  .tveh.me { border-color: #fff; }    /* the selected service itself */
  .tstop .tname {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Every time in the service colour: whether the run is live or timetabled
     is said ONCE, by the 🛜/📅 beside the badge in the panel header (and by
     the vehicle marker being solid or ghosted) — not re-encoded per row.
     Grey is reserved for .past rows, where the whole row dims. */
  .tstop .ttime {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    color: var(--vcolor); flex: none;
  }
  .tstop.past { opacity: 0.45; }
  .tstop.here .tname { color: var(--text); font-weight: 600; }
  .tstop.here::before { background: #fff; border-color: #fff; }
  .tstop.skipped .tname, .tstop.skipped .ttime {
    text-decoration: line-through; color: var(--muted);
  }
  /* Collapsed history: "⋯ 12 earlier stops" above the last three served. */
  .tmore {
    padding: 4px 0 6px; font-size: 11px;
    font-family: "IBM Plex Mono", monospace; color: var(--muted);
  }

  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .due { animation: none !important; }
    /* Still needs to be identifiable, so hold the tint rather than pulse it. */
    .row.flash {
      animation: none;
      background: color-mix(in srgb, var(--vcolor) 24%, var(--panel));
    }
  }

  .eta {
    font-family: "IBM Plex Mono", monospace;
    text-align: right;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(255, 180, 0, 0.35);
  }
  .eta .num { font-size: 30px; font-weight: 600; line-height: 1; }
  .eta .unit { font-size: 11px; color: var(--amber-dim); letter-spacing: 0.1em; }
  /* The countdown carries the service colour too, so the row reads as one
     object. The amber glow is dropped — it would tint the colour. */
  .eta { color: var(--vcolor); text-shadow: none; }
  .eta .unit { color: var(--vcolor); opacity: 0.6; }
  /* 📶 realtime / 📅 timetable — its own column between destination and
     countdown, so neither the number nor "MIN" is shifted by it. */
  .src-col {
    font-family: "Noto Emoji", system-ui, sans-serif;
    font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--vcolor); opacity: 0.85;
    font-variant-emoji: text;
  }
  /* Disruption warning, beside the source mark. Amber — it is a warning, not
     part of the service's identity, so it does not take the vehicle colour. */
  .alert-mark {
    color: var(--amber); cursor: pointer; opacity: 1;
    background: none; border: 0; font: inherit; padding: 2px;
    font-variant-emoji: text;
  }
  .alert-mark:hover { text-shadow: 0 0 8px rgba(255, 180, 0, 0.6); }
  .alert-mark:focus-visible { outline: 2px solid var(--amber-dim); outline-offset: 2px; }

  /* Disruption details popup. */
  .alert-modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(6, 9, 12, 0.72);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .alert-modal[hidden] { display: none; }
  .alert-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    max-width: 560px; max-height: 76vh; overflow-y: auto;
    padding: 20px 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .alert-box h2 {
    font-size: 15px; margin-bottom: 12px; color: var(--amber);
    display: flex; align-items: center; gap: 8px;
  }
  .alert-box h2 .glyph { font-family: "Noto Emoji", sans-serif; font-variant-emoji: text; }
  .alert-item { border-top: 1px solid var(--line); padding: 12px 0; }
  .alert-item:first-of-type { border-top: 0; padding-top: 0; }
  .alert-item .effect {
    font-family: "IBM Plex Mono", monospace; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--amber);
    margin-bottom: 4px;
  }
  .alert-item .head { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .alert-item .body {
    font-size: 13px; color: var(--muted); white-space: pre-line; line-height: 1.45;
  }
  .alert-close {
    margin-top: 14px; background: none; border: 1px solid var(--line);
    border-radius: 999px; color: var(--muted); font: inherit; font-size: 12px;
    padding: 4px 14px; cursor: pointer;
  }
  .alert-close:hover { color: var(--text); border-color: var(--amber-dim); }
  .eta .due {
    font-size: 22px; font-weight: 600; letter-spacing: 0.06em;
    animation: pulse 1.2s infinite;
  }

  .status {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; color: var(--muted);
    margin-top: 12px; text-align: right;
  }
  .empty, .error {
    padding: 32px 16px; text-align: center;
    color: var(--muted); font-size: 14px;
    background: var(--panel);
  }
  .error { color: #ff8a7a; }

  /* Both first-run panels — board and map — share one empty state so they read
     as a matched pair: same height, text on top, a monochrome glyph naming the
     panel's job beneath it. --ph-height keeps the two boxes exactly level. */
  :root { --ph-height: 240px; }
  .placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; min-height: var(--ph-height); padding: 24px;
  }
  .placeholder .ph-icon {
    font-family: "Noto Emoji", system-ui, sans-serif;
    font-variant-emoji: text;      /* the monochrome outline, tinted like text */
    font-size: 46px; line-height: 1;
    color: var(--muted); opacity: 0.6;
  }

  /* --- board + map layout ------------------------------------------------ */
  /* Stacked by default; side by side only when there is room AND a map. The
     board keeps its natural width and the map takes the remaining space. */
  .split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  @media (min-width: 900px) {
    /* The board is a fixed, comfortable reading width on the left; the map takes
       all the remaining width, so the space a wide screen frees up goes to the
       map rather than to stretched-out rows. */
    .split.side-by-side {
      grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
      align-items: start;
    }
    /* Fill the viewport height too, so the map is as big as fits without
       scrolling. The board caps its own rows to what fits (fittingRowCount). */
    .split.side-by-side #map { height: calc(100vh - 160px); min-height: 460px; }
    /* The map column is sticky so it stays visible against a long board. */
    .split.side-by-side #map-wrap { position: sticky; top: 24px; }
  }

  /* --- map view ---------------------------------------------------------- */
  #map-wrap[hidden] { display: none; }
  #map-wrap { position: relative; }
  /* Covers the map until a stop is chosen. The map is built and loading
     underneath — MapLibre needs a sized container, and having it warm means it
     draws the moment a stop is picked — but an empty view of Brisbane says
     nothing, so it is not shown. */
  /* Layout (centering, min-height) comes from .placeholder; this rule only
     covers the map and matches the board's panel styling. */
  /* Edge markers: a board vehicle outside the current view gets a ringed
     glyph pinned to the map edge nearest to it, with an arrow on the rim
     aiming at the vehicle. (The ring shape is free for this job now that
     ghosts are no longer drawn ringed.) Clicking one flies to the vehicle. */
  #edge-markers {
    position: absolute; inset: 0;
    overflow: hidden; pointer-events: none; z-index: 1;
  }
  .edge-veh {
    position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%;
    background: rgba(12, 16, 19, 0.9);
    border: 2px solid var(--vcolor);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Emoji", system-ui, sans-serif;
    font-variant-emoji: text; font-size: 15px; line-height: 1;
    color: var(--vcolor);
    pointer-events: auto; cursor: pointer;
  }
  .edge-veh::after {                  /* rim arrow, aimed by --angle */
    content: ""; position: absolute; left: 50%; top: 50%;
    border: 5px solid transparent; border-left: 8px solid var(--vcolor);
    border-right: 0;
    transform: translate(-50%, -50%) rotate(var(--angle)) translateX(21px);
  }

  .map-empty {
    position: absolute; inset: 0; z-index: 2; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    color: var(--muted); font-size: 14px;
  }
  .map-empty[hidden] { display: none; }
  /* While the placeholder is up the map matches the board placeholder's height
     exactly, so the two first-run panels sit level. Still sized, so MapLibre
     can measure its container and load underneath. */
  #map-wrap.awaiting #map,
  .split.side-by-side #map-wrap.awaiting #map {
    /* +2px: the board's 1px border wraps its --ph-height placeholder (outer
       242), whereas #map is border-box (border inside height). Matching the
       outer boxes keeps the two empty panels exactly level. */
    height: calc(var(--ph-height) + 2px); min-height: calc(var(--ph-height) + 2px);
  }
  #map {
    height: 360px; border-radius: 10px; overflow: hidden;
    background: #0c1013; border: 1px solid #232c35;
  }
  .map-caption {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; padding: 8px 2px 0; color: var(--muted); font-size: 13px;
  }
  /* `display: flex` above outranks the UA `[hidden] { display: none }`, so
     without this the caption keeps its ~22px of layout even while hidden —
     which, under the opaque .map-empty overlay, made the empty map panel a text
     row taller than the board. */
  .map-caption[hidden] { display: none; }
  .map-caption .hint { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  /* MapLibre's own chrome, toned down to match the board */
  .maplibregl-ctrl-attrib { background: rgba(12,16,19,.8) !important; }
  .maplibregl-ctrl-attrib a { color: #7f8c99 !important; }
  /* Zoom −/+ as a row, so the whole control stack stays compact. */
  .maplibregl-ctrl-group:has(> .maplibregl-ctrl-zoom-in) {
    display: flex; flex-direction: row-reverse;
  }
  .maplibregl-ctrl-group:has(> .maplibregl-ctrl-zoom-in) button + button { border-top: none; }
  .maplibregl-ctrl-group:has(> .maplibregl-ctrl-zoom-in) button:first-child {
    border-left: 1px solid #ddd;
  }
  /* Scale bar, restyled for the dark map. */
  .maplibregl-ctrl-scale {
    background: rgba(12,16,19,.75); color: #cfd8e3; border-color: #7f8c99;
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
  }
  .maplibregl-popup-content {
    background: var(--panel); color: var(--text);
    font-family: Archivo, system-ui, sans-serif; font-size: 13px;
    border-radius: 8px; padding: 8px 10px; border: 1px solid #2b3742;
  }
  .maplibregl-popup-content .pop-route { font-weight: 700; }
  .maplibregl-popup-content .pop-sub {
    color: var(--muted); font-size: 11px;
    font-family: "IBM Plex Mono", monospace;
  }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; }
</style>

<script src="/static/vendor/maplibre-gl.js"></script>
<script src="/static/vendor/pmtiles.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let stopId = new URLSearchParams(location.search).get("stop");
  let timer = null;

  // ?at=lon,lat,zoom — a camera handed across a region swap. With no stop it
  // also puts the page into map-BROWSING mode: the map is open (all-stops
  // clickable, board still empty) instead of the landing, so panning from
  // one city into another feels continuous across the provider change.
  const atParam = (() => {
    const raw = new URLSearchParams(location.search).get("at");
    if (!raw) return null;
    const [lon, lat, zoom] = raw.split(",").map(Number);
    return [lon, lat, zoom].every(Number.isFinite) ? { lon, lat, zoom } : null;
  })();
  const browsing = Boolean(atParam) && !stopId;

  // ?pin=lon,lat — a dropped pin: the residential address the user searched.
  // Drawn as an amber marker once the map is up; the cross-region hand-over
  // treats it like an anchored stop (the pin's region was chosen by
  // nearest-stop, so browsing around it must not get second-guessed).
  const pinRaw = new URLSearchParams(location.search).get("pin");
  const pinParam = (() => {
    if (!pinRaw) return null;
    const [lon, lat] = pinRaw.split(",").map(Number);
    return [lon, lat].every(Number.isFinite) ? { lon, lat } : null;
  })();
  // ?to=stop_id — journey-planner mode (PLANNER.md phase 1): the board
  // becomes itineraries from the viewed stop to this one. Same region only.
  // A POINT destination (?tolat/?tolon — a business, an address) keeps its
  // identity: the journey ends at the door, via a trailing walk from the
  // last stop, never silently "translated" into the nearest stop.
  let toId = new URLSearchParams(location.search).get("to");
  let toName = new URLSearchParams(location.search).get("toname") || "";
  let toPoint = (() => {
    const p = new URLSearchParams(location.search);
    const lat = Number(p.get("tolat")), lon = Number(p.get("tolon"));
    return (p.get("tolat") && Number.isFinite(lat) && Number.isFinite(lon))
      ? { lat, lon } : null;
  })();
  const hasDest = () => Boolean(toId || toPoint);
  const destKey = () => toId
    || (toPoint ? `pt:${toPoint.lat.toFixed(5)},${toPoint.lon.toFixed(5)}` : null);

  // The pin's display label ("397 Christine Avenue, Varsity Lakes QLD" /
  // "Near me") — shown in the titlebar like a stop name.
  const pinLabel = new URLSearchParams(location.search).get("pinlabel") || "";
  // Pinned-browse: the map is anchored to an address rather than a stop.
  // The chrome behaves like a stop view (titlebar + goose, folded search,
  // "Change address") until an actual stop is picked. A pin WITHOUT a stop
  // is a pinned browse even with no ?at= — shared planner URLs carry only
  // pin/to, and the camera falls back to the pin.
  const pinnedBrowse = Boolean(pinParam) && !stopId;
  // The stops surrounding a dropped pin — fetched once the map is up, drawn
  // as clickable landmarks at ANY zoom (the all-stops layer needs z15+, and
  // a sparse suburb's nearest stops can force the camera further out).
  let pinStops = [];

  // --- region ------------------------------------------------------------
  // One board, many networks. The region picks the timetable DB, the realtime
  // feeds, the timezone and the basemap — all server-side; the client just
  // scopes its API calls and reloads when switched (the map style, caches and
  // colour state are all per-network, so a clean start is correct).
  const region = new URLSearchParams(location.search).get("region")
              || localStorage.getItem("region") || "seq";
  localStorage.setItem("region", region);
  const api = (path) => `/api/r/${region}${path}`;

  // Crossing into another region (a search pick, or panning the map there)
  // reloads: the map style, caches and colour state are all per-network, so
  // a clean start is correct. `at=lon,lat,zoom` carries the camera across so
  // the map reopens exactly where the user was looking.
  function switchRegion(next, at) {
    if (next === region) return;
    localStorage.setItem("region", next);
    location.href = `?region=${encodeURIComponent(next)}`
                  + (at ? `&at=${at}` : "");                 // drop the stop
  }

  // Times on the board are the *network's* clock, not the viewer's: a Brisbane
  // browser looking at Melbourne shows AEDT. Filled from /config; until then
  // the viewer's zone is a harmless first-paint fallback.
  let regionTz;
  fetch(api("/config")).then((r) => r.json())
    .then((c) => {
      regionTz = c.tz;
      // Name the clock those times run on: "AWST", "ACST", … — visible
      // whenever the titlebar is (i.e. whenever any time is on screen).
      try {
        const abbr = new Intl.DateTimeFormat("en-AU",
            {timeZone: regionTz, timeZoneName: "short"})
          .formatToParts(new Date())
          .find((p) => p.type === "timeZoneName").value;
        const badge = $("tz-badge");
        $("tz-abbr").textContent = abbr;
        badge.hidden = false;
        badge.title = `All times are ${regionTz} (${abbr})`;
      } catch { /* unknown zone: badge stays empty and hidden */ }
    }).catch(() => {});

  // There is no visible region UI: the ingested-regions list drives the
  // search fan-out (results can come from ANY region, each row carrying its
  // state) and the map's pan-across-regions check (each entry's center).
  let regionList = [{ id: region, name: "", state: "" }];
  const stateOf = (rid) =>
    (regionList.find((r) => r.id === rid) || {}).state || "";
  // Search order: the remembered region's results list first.
  const regionOrder = () =>
    [...regionList].sort((a, b) => (b.id === region) - (a.id === region));
  const regionsReady = fetch("/api/regions").then((r) => r.json())
    .then((regions) => { regionList = regions; })
    .catch(() => { /* search stays single-region, no pan-swap */ });

  // With no anchor (stop OR pin) there is nothing but the search, so it is
  // always open. Anchored, the search folds away and "Change stop" /
  // "Change address" brings it back.
  let searchOpen = !stopId && !pinnedBrowse;

  function syncChrome() {
    // No stop yet = the landing: just the goose and the search. The class
    // hides the chrome and parks the board/map split off-screen (still sized,
    // so the map keeps warming underneath). Map-browsing mode (?at=, from a
    // pan across regions) keeps the full layout instead.
    const anchored = Boolean(stopId) || pinnedBrowse;
    document.body.classList.toggle("landing", !stopId && !browsing && !pinnedBrowse);
    $("titlebar").hidden = !anchored;
    $("search-wrap").hidden = anchored && !searchOpen;
    $("search-close").hidden = !anchored;  // nothing to return to without one
    // A selected stop needs no "change" button — the goose is the way back.
    // The button only serves a pinned browse, to search a different address.
    $("change-stop").hidden = Boolean(stopId) || !pinnedBrowse;
    $("change-stop").textContent = "Change address";
    // Planner entry/exit: available from a stop OR a pinned address (the
    // trip then STARTS at the address — first leg is the walk to a stop).
    // With a destination set, the same button cancels back.
    $("plan-to").hidden = !stopId && !pinnedBrowse;
    $("plan-to").textContent = hasDest() ? `✕ to ${toName || "destination"}`
                                    : "Plan a trip";
    if (!searchOpen) $("results").hidden = true;
  }
  if (pinnedBrowse) {
    // The address plays the part of the stop name until a stop is picked.
    $("stop-name").textContent = pinLabel || "Dropped pin";
  }

  function openSearch() {
    searchOpen = true;
    syncChrome();
    $("search").focus();
  }

  function closeSearch() {
    searchOpen = false;
    pickingDest = false;
    $("search").value = "";
    $("search").placeholder = "Search for a stop or an address";
    syncChrome();
  }

  $("change-stop").addEventListener("click", openSearch);
  $("search-close").addEventListener("click", closeSearch);

  // --- journey planner mode ------------------------------------------------
  let pickingDest = false;
  let planData = null, selItin = 0, planFitted = false;

  // A STARTED journey is a commitment: it stays on the board after its
  // departure time passes (a fresh plan would no longer return it). It is
  // re-costed each poll by re-planning anchored at its original departure
  // (`at=` — the schedule is deterministic, so the same legs come back
  // with current realtime), and it survives reloads via localStorage.
  let startedPlan = null;
  try {
    const s = JSON.parse(localStorage.getItem("startedJourney") || "null");
    if (s && s.region === region && hasDest() && s.toId === destKey()) {
      startedPlan = s;
    }
  } catch { /* corrupted store: ignore */ }
  const itinKey = (it) => it.legs.filter((l) => l.kind === "ride")
    .map((l) => `${l.trip_id}@${l.board}`).join(">");
  function saveStarted() {
    if (startedPlan) {
      localStorage.setItem("startedJourney", JSON.stringify(startedPlan));
    } else {
      localStorage.removeItem("startedJourney");
    }
  }

  function syncPlanUrl() {
    const p = new URLSearchParams();
    p.set("region", region);
    if (stopId) p.set("stop", stopId);
    if (toId) { p.set("to", toId); }
    else if (toPoint) {
      p.set("tolat", toPoint.lat.toFixed(5));
      p.set("tolon", toPoint.lon.toFixed(5));
    }
    if (hasDest() && toName) p.set("toname", toName);
    if (pinParam) { p.set("pin", pinRaw); if (pinLabel) p.set("pinlabel", pinLabel); }
    history.replaceState(null, "", "?" + p.toString());
  }

  function setDest(sid, name) {
    toId = sid;
    toPoint = null;
    _destChosen(name || sid);
  }

  // A place or address as destination stays a POINT — the pizza joint IS
  // the destination; the planner walks the last leg to its door.
  function setDestPoint(lat, lon, label) {
    toId = null;
    toPoint = { lat, lon };
    _destChosen(label || "destination");
  }

  function _destChosen(name) {
    toName = name;
    pickingDest = false;
    planData = null; selItin = 0; planFitted = false;
    $("search").placeholder = "Search for a stop or an address";
    closeSearch();
    syncPlanUrl();
    syncChrome();
    $("board").innerHTML = `<div class="empty">Planning…</div>`;
    refresh();
    // A pinned-address plan has no stop selected, so no poll is running yet.
    clearInterval(timer);
    timer = setInterval(refresh, 15000);
  }

  function cancelPlan() {
    toId = null; toPoint = null; toName = ""; planData = null;
    startedPlan = null; saveStarted();
    clearPlanLayers();
    syncPlanUrl();
    syncChrome();
    if (!stopId) {
      // back to the pinned browse: stops on the map, empty board
      clearInterval(timer);
      $("board").innerHTML = `<div class="empty placeholder">
        <div>Select a stop to see departures.</div>
        <div class="ph-icon">&#x1F570;&#xFE0E;</div></div>`;
      drawLandmarks();   // restore the pin's surrounding stops
      return;
    }
    refresh();
  }

  $("plan-to").addEventListener("click", () => {
    if (hasDest()) { cancelPlan(); return; }
    pickingDest = true;
    $("search").placeholder = "Where to?";
    openSearch();
  });

  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Escape" && (stopId || pinnedBrowse)) closeSearch();
  });

  // --- stop search -------------------------------------------------------
  // Three ways in: stop-name search (a dropdown of stops), address search
  // (geocoded server-side) and "near me" (browser geolocation) — the last
  // two both end at openPinned(): pin on the map, surrounding stops around it.
  const fmtDist = (m) => m < 1000 ? `${m} m` : `${(m / 1000).toFixed(1)} km`;

  function resultButton(html, onclick) {
    const b = document.createElement("button");
    b.innerHTML = html;
    b.onclick = onclick;
    $("results").appendChild(b);
    return b;
  }

  function resultNote(text) {
    const b = document.createElement("button");
    b.textContent = text;
    b.disabled = true;
    b.style.color = "var(--muted)";
    b.style.cursor = "default";
    $("results").appendChild(b);
  }

  // The dropdown must never run past the bottom of the screen, on any device:
  // cap it to the space between its own top edge and the viewport bottom, and
  // let the overflow scroll inside. visualViewport (where available) tracks
  // the on-screen keyboard, which window.innerHeight does not.
  function fitResults() {
    const box = $("results");
    if (box.hidden) return;
    const vh = window.visualViewport ? window.visualViewport.height
                                     : window.innerHeight;
    const top = box.getBoundingClientRect().top;
    box.style.maxHeight = `${Math.max(96, vh - top - 12)}px`;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitResults);
  }

  // A picked stop in another region: remember the region and reload straight
  // onto the stop — the map style, caches and colours are all per-network.
  function openInRegion(rid, sid) {
    localStorage.setItem("region", rid);
    location.href =
      `?region=${encodeURIComponent(rid)}&stop=${encodeURIComponent(sid)}`;
  }

  function stopEntry(s) {
    const bits = [];
    if (s.is_station) bits.push("station");
    if (s.dist_m != null) bits.push(fmtDist(s.dist_m));
    bits.push(s.stop_id);
    if (s.state) bits.push(s.state);
    const rid = s.region || region;
    resultButton(
      `<span class="rmain">${escapeHtml(s.stop_name)}` +
        `<span class="sid">${bits.join(" · ")}</span></span>` +
        `<span class="ricon" aria-hidden="true">` +
        `${asText(landmarkGlyph(s.route_type))}</span>`,
      () => {
        if (pickingDest) {
          // Destination pick: same network only (cross-region is phase 3).
          if (rid !== region) {
            resultNote("Cross-region journeys aren't supported yet — "
                       + "pick a destination in this network.");
            return;
          }
          setDest(s.stop_id, s.stop_name);
          return;
        }
        rid === region ? selectStop(s.stop_id) : openInRegion(rid, s.stop_id);
      },
    );
  }

  // Stop names and geocoder labels are external data; never trust them as HTML.
  const escapeHtml = (t) => String(t).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // rid narrows the lookup to one region when the caller is CERTAIN the
  // point belongs to it; null asks every region and lets distance sort it
  // out (only the right city returns anything close). Address hits pass
  // null: geocode viewboxes overlap (nsw spans four states), so "the region
  // whose lookup found it" proved to be the wrong region for a Varsity
  // Lakes street that came back via nsw — whose nearest stop is 100 km off.
  async function fetchNearby(lat, lon, rid = null) {
    await regionsReady.catch(() => {});
    const rids = rid ? [{ id: rid, state: stateOf(rid) }] : regionOrder();
    const lists = await Promise.all(rids.map(async (r) => {
      try {
        const res = await fetch(
          `/api/r/${r.id}/stops/nearby?lat=${lat}&lon=${lon}`);
        return (await res.json())
          .map((s) => ({ ...s, region: r.id, state: r.state }));
      } catch { return []; }
    }));
    return lists.flat().sort((a, b) => a.dist_m - b.dist_m);
  }

  // A located point — a clicked address, or "near me" — goes straight to
  // the map: an amber pin on the spot, the surrounding stops visible and
  // clickable (the all-stops layer is live at this zoom). The region is
  // whichever network actually has the NEAREST stop — never the region
  // whose geocoder resolved the address; their viewboxes overlap (see the
  // Varsity-Lakes-NSW incident).
  async function openPinned(lat, lon, what, label) {
    const box = $("results");
    box.innerHTML = "";
    resultNote(`Finding stops near ${what}…`);
    box.hidden = false;
    fitResults();
    let stops = [];
    try { stops = await fetchNearby(lat, lon); } catch { /* fall through */ }
    if (!stops.length) {
      box.innerHTML = "";
      resultNote(`No stops near ${what}.`);
      fitResults();
      return;
    }
    const rid = stops[0].region;
    const lonlat = `${lon.toFixed(5)},${lat.toFixed(5)}`;
    localStorage.setItem("region", rid);
    location.href = `?region=${encodeURIComponent(rid)}`
                  + `&at=${lonlat},16&pin=${lonlat}`
                  + `&pinlabel=${encodeURIComponent(label || what)}`;
  }

  // On a pinned page: fetch the stops around the pin, hand them to the
  // landmarks layer, and fit the camera so the pin AND its stops are all in
  // view — a dense corner stays at street zoom (maxZoom caps it), a sparse
  // suburb zooms out until its stops appear.
  async function loadPinSurrounds() {
    if (!pinParam || !mapReady) return;
    try {
      const near = (await fetchNearby(pinParam.lat, pinParam.lon, region))
        .filter((s, i) => i === 0 || s.dist_m <= 1500)
        .slice(0, 8);
      if (!near.length) return;   // the pin alone is still worth showing
      pinStops = near;
      drawLandmarks();
      if (browsing) {
        const b = new maplibregl.LngLatBounds(
          [pinParam.lon, pinParam.lat], [pinParam.lon, pinParam.lat]);
        for (const s of pinStops) b.extend([s.lon, s.lat]);
        cameraMove(() => map.fitBounds(b, { padding: 80, maxZoom: 16.5 }));
      }
    } catch { /* the pin alone is still worth showing */ }
  }

  // Append address candidates to the dropdown (below any stop matches).
  // ONE nationwide query, biased to the current region's viewbox — the
  // region a clicked address lands in comes from its nearest STOP, so
  // there is nothing to gain from asking all nine regions, and everything
  // to lose: the server serialises Nominatim at 1 req/s, so the old
  // fan-out took ~9 s per uncached address.
  async function searchAddress(q, { clear = true, signal, stale } = {}) {
    stale = stale || (() => false);
    const box = $("results");
    if (clear) { box.innerHTML = ""; resultNote(`Looking up “${q}”…`); }
    box.hidden = false;
    fitResults();
    try {
      await regionsReady.catch(() => {});
      const res = await fetch(api(`/geocode?q=${encodeURIComponent(q)}`),
                              { signal });
      if (stale()) return;   // superseded while the geocoder was working
      if (!res.ok) throw new Error();
      // Nominatim can return near-duplicate rows — one label, one row.
      const seen = new Set();
      const places = (await res.json())
        .map((p) => ({ ...p, region, state: stateOf(region) }))
        .filter((p) => !seen.has(p.label) && seen.add(p.label));
      if (stale()) return;
      if (clear) box.innerHTML = "";
      if (!places.length) {
        if (clear) resultNote(`Nothing found for “${q}”.`);
        return;
      }
      places.forEach((p) => {
        // Just the label ('lead, suburb STATE', built server-side) — no tag:
        // an address row is recognisable by its shape, and the missing stop
        // glyph on the right already tells it apart from a stop.
        resultButton(
          `<span class="rmain">${escapeHtml(p.label)}</span>`,
          () => pickingDest
            ? setDestPoint(p.lat, p.lon, p.label)   // the PLACE is the dest
            : openPinned(p.lat, p.lon, "that address", p.label),
        );
      });
    } catch {
      if (stale()) return;   // an aborted run must not paint an error note
      if (clear) { box.innerHTML = ""; resultNote("Address lookup unavailable right now."); }
    } finally {
      fitResults();
    }
  }

  // A trailing word may still be mid-typing; an address is assumed once the
  // query has a house number or is long enough that no stop matched it.
  const looksLikeAddress = (q) => /^\d+\s+\S/.test(q);

  // Stop-name search fans out over every ingested region; the row's state
  // label (QLD/VIC) is what tells two "Central Station"s apart.
  async function searchStops(q, signal) {
    await regionsReady.catch(() => {});
    const lists = await Promise.all(regionOrder().map(async (r) => {
      try {
        const res = await fetch(
          `/api/r/${r.id}/stops/search?q=${encodeURIComponent(q)}`, { signal });
        return (await res.json())
          .map((s) => ({ ...s, region: r.id, state: r.state }));
      } catch { return []; }
    }));
    return lists.flat();
  }

  let searchDebounce;
  let searchToken = 0;      // bumped on EVERY keypress; in-flight runs bail
  let searchAbort = null;   // …and their fetches are cancelled outright
  $("search").addEventListener("input", (e) => {
    clearTimeout(searchDebounce);
    // A new keypress abandons the previous search immediately: its fetches
    // are aborted and any response already in flight is dropped before it
    // can render (the token check) — stale results must never flash in.
    searchToken++;
    if (searchAbort) searchAbort.abort();
    const q = e.target.value.trim();
    if (q.length < 3) { $("results").hidden = true; return; }
    // Fast typists: nothing is searched until the keyboard has been quiet
    // for a full second — it also keeps mid-typing queries away from the
    // shared 1 req/s geocoder.
    searchDebounce = setTimeout(async () => {
      const token = searchToken;
      const stale = () => token !== searchToken;
      const ctl = (searchAbort = new AbortController());
      const stops = await searchStops(q, ctl.signal);
      if (stale()) return;
      const box = $("results");
      box.innerHTML = "";
      stops.forEach(stopEntry);
      // Address lookup happens automatically — nobody should have to say
      // "that was an address": a query starting with a house number is one,
      // and a longer query matching no stop name probably is too.
      if (looksLikeAddress(q) && q.length >= 6) {
        await searchAddress(q, { clear: stops.length === 0,
                                 signal: ctl.signal, stale });
      } else if (!stops.length && q.length >= 6) {
        await searchAddress(q, { signal: ctl.signal, stale });
      }
      if (stale()) return;
      box.hidden = box.children.length === 0;
      fitResults();
    }, 1000);
  });

  // "near me" is only offered where it can actually deliver: the device must
  // have a geolocation API, and the page must be a secure context (https, or
  // localhost during dev) — browsers silently deny geolocation on plain http,
  // so on the bare-IP VPS the button would be a dead end.
  if (!("geolocation" in navigator) || !window.isSecureContext) {
    $("near-me").hidden = true;
  }

  $("near-me").addEventListener("click", () => {
    const box = $("results");
    if (!navigator.geolocation) {
      box.innerHTML = ""; resultNote("This browser has no geolocation."); box.hidden = false;
      return;
    }
    box.innerHTML = "";
    resultNote("Locating…");
    box.hidden = false;
    fitResults();
    navigator.geolocation.getCurrentPosition(
      (pos) => openPinned(pos.coords.latitude, pos.coords.longitude, "you",
                          "Near me"),
      () => {
        box.innerHTML = "";
        // Browsers only allow geolocation on HTTPS (localhost excepted).
        resultNote(location.protocol === "http:" && location.hostname !== "localhost"
          ? "Location blocked: geolocation needs HTTPS."
          : "Could not get your location.");
      },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 },
    );
  });

  function selectStop(id, rgn) {
    // A landmark from a sibling region's traced route: that stop lives in the
    // other region's timetable, so open it there (a full reload — the map
    // style, caches and colour state are all per-network).
    if (rgn && rgn !== region) {
      localStorage.setItem("region", rgn);
      location.href = `?region=${encodeURIComponent(rgn)}&stop=${encodeURIComponent(id)}`;
      return;
    }
    stopId = id;
    selectedTrip = null;      // a route from the previous stop is not relevant
    // There is something to look at now: uncover the map and give it its full
    // height, then tell MapLibre the container changed.
    $("map-empty").hidden = true;
    $("map-caption").hidden = false;
    if ($("map-wrap").classList.contains("awaiting")) {
      $("map-wrap").classList.remove("awaiting");
      if (mapReady) cameraMove(() => map.resize());
    }
    autoFit = true;           // a new stop re-enables auto-fit...
    forceFit = true;          // ...and reframes even if the user had panned
    closeSearch();            // a stop is chosen: fold the search away
    syncRailStationFilter();  // stop drawing the station we now view in grey
    planFitted = false;   // a new origin reframes the journey, if one is set
    syncPlanUrl();        // keeps the address pin AND any planner destination
    refresh();
    clearInterval(timer);
    timer = setInterval(refresh, 15000);
  }

  // --- map ---------------------------------------------------------------
  // The basemap is a self-hosted Protomaps extract on the data volume. If the
  // deployment has no basemap, /api/config says so and the map stays hidden —
  // the board is the product, the map is an enhancement.
  let map = null, mapReady = false, hasBasemap = false;
  // The view auto-fits to the stop plus every tracked vehicle. It stops doing
  // so the moment the user moves the map themselves, and resumes on the next
  // stop selection. `programmatic` distinguishes our own camera moves from
  // theirs — including the +/- buttons, which move the map without a DOM event.
  let autoFit = true, forceFit = true, programmatic = false;

  // Twelve hues at 30° spacing. Every departure gets one now, not just the
  // tracked ones, so the palette has to cover a full board. Colour identifies
  // a *service*; it must not shift when that service gains or loses a live
  // position, which is why live/scheduled is shown separately.
  const VEHICLE_COLORS = [
    "#ff5a52", // red
    "#ff8a2b", // orange
    "#ffc21f", // amber
    "#d8e02a", // yellow-lime
    "#7ee02a", // lime
    "#2fd07a", // green
    "#25d3b0", // teal
    "#22d3ee", // cyan
    "#4e8cff", // blue
    "#8a7bff", // indigo
    "#c06bff", // purple
    "#ff5fb0", // magenta
  ];
  // Landmarks: the stops themselves, never a service.
  const LANDMARK_INK = "#8c98a4";          // grey — every landmark
  const LANDMARK_SELECTED_INK = "#ffffff"; // white — the stop being viewed

  // Mode glyphs, rendered in the monochrome Noto Emoji face so they tint with
  // `color` like ordinary text. GTFS route_type: 0 tram, 1 metro, 2 rail,
  // 3 bus, 4 ferry.
  const MODE_EMOJI = {
    0: "\u{1F68A}", // 🚊 tram
    1: "\u{1F686}", // 🚆 train
    2: "\u{1F686}", // 🚆 train
    3: "\u{1F68D}", // 🚍 bus
    4: "\u{26F4}",  // ⛴ ferry
  };
  const DEFAULT_EMOJI = MODE_EMOJI[3];

  // Landmark glyphs — the physical stop, not the service calling at it.
  const STOP_STATION = "\u{1F3EB}";  // 🏫
  const STOP_BUS = "\u{1F68F}";      // 🚏
  const STOP_TRAM = "\u{1F689}";     // 🚉
  const STOP_FERRY = "\u{2638}";     // ☸ wharf — the vehicle keeps ⛴

  // Where the arrival time came from.
  const MARK_LIVE = "\u{1F6DC}";      // 🛜 realtime prediction
  const MARK_SCHEDULED = "\u{1F4C5}"; // 📅 timetable only
  const MARK_ALERT = "\u{26A0}";      // ⚠ service disruption

  // These codepoints default to *emoji presentation*, and browsers hand those
  // to the system colour-emoji font regardless of font-family — so on a machine
  // with Noto Color Emoji installed our monochrome face is ignored. U+FE0E
  // (VARIATION SELECTOR-15) requests text presentation instead, which lets the
  // font-family stack apply. Only for the DOM: canvas shapes text itself and
  // already picks the right face.
  const asText = (glyph) => glyph + "︎";

  function landmarkGlyph(routeType) {
    switch (Number(routeType)) {
      case 3: return STOP_BUS;
      case 4: return STOP_FERRY;
      case 0: return STOP_TRAM;
      case 1: case 2: return STOP_STATION;
      default: return STOP_BUS;
    }
  }

  // The stop being viewed, judged by what actually calls there rather than by
  // location_type, which cannot tell a ferry terminal from a bus stop.
  function stopGlyph(data) {
    // If trains call here it is a train station, even when buses out-number
    // them — Varsity Lakes is a station with 10 bus bays, not a bus stop. The
    // majority vote below is only for deciding between the non-rail modes.
    if (data.departures.some((d) => [1, 2].includes(Number(d.route_type)))) {
      return STOP_STATION;
    }
    const counts = {};
    data.departures.forEach((d) => {
      counts[d.route_type] = (counts[d.route_type] || 0) + 1;
    });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    if (top) return landmarkGlyph(Number(top[0]));
    return data.stop.location_type === 1 ? STOP_STATION : STOP_BUS;
  }

  // A service keeps its colour. Once assigned, a trip_id holds that colour for
  // as long as it is remembered — across refreshes, as the board advances, and
  // whether or not it currently has a live position. Insertion-ordered, so the
  // oldest entry is the first evicted.
  const colorMemory = new Map();   // trip_id -> palette index
  const COLOR_MEMORY_MAX = 300;    // a few hours of a busy board

  // Of the colours not already on screen, take the one furthest around the
  // wheel from those that are — so a newly arriving service is as distinct as
  // the remaining palette allows, rather than just the next index along.
  function pickFreeIndex(usedIdx) {
    const P = VEHICLE_COLORS.length;
    const free = [];
    for (let i = 0; i < P; i++) if (!usedIdx.has(i)) free.push(i);
    if (!free.length) return usedIdx.size % P;   // more services than colours
    if (!usedIdx.size) return 0;
    let best = free[0], bestGap = -1;
    for (const i of free) {
      let gap = P;
      for (const j of usedIdx) {
        const d = Math.abs(i - j);
        gap = Math.min(gap, Math.min(d, P - d));
      }
      if (gap > bestGap) { bestGap = gap; best = i; }
    }
    return best;
  }

  function assignColors(items) {
    const out = {}, usedIdx = new Set();

    // Remembered colours win, provided nothing else on screen has taken it.
    for (const d of items) {
      const idx = colorMemory.get(d.trip_id);
      if (idx !== undefined && !usedIdx.has(idx)) {
        out[d.trip_id] = VEHICLE_COLORS[idx];
        usedIdx.add(idx);
      }
    }
    // Anything new — or displaced by a collision — takes a free colour.
    for (const d of items) {
      if (out[d.trip_id]) continue;
      const idx = pickFreeIndex(usedIdx);
      out[d.trip_id] = VEHICLE_COLORS[idx];
      usedIdx.add(idx);
      colorMemory.set(d.trip_id, idx);
    }
    // Re-insert the ones still on screen so eviction drops genuinely stale
    // trips first, not the ones currently being looked at.
    for (const d of items) {
      const idx = colorMemory.get(d.trip_id);
      colorMemory.delete(d.trip_id);
      colorMemory.set(d.trip_id, idx);
    }
    while (colorMemory.size > COLOR_MEMORY_MAX) {
      colorMemory.delete(colorMemory.keys().next().value);
    }
    return out;
  }

  async function initMap() {
    let cfg;
    try {
      cfg = await (await fetch(api("/config"))).json();
      hasBasemap = !!cfg.basemap;
    } catch { hasBasemap = false; }
    if (!hasBasemap) return;

    // Must complete before any icon is rasterised, or the wrong glyph gets
    // baked into the cached image. ensureVehicleIcon only runs after the map's
    // 'load', which is well after this await.
    await loadEmojiFont();

    // Reveal before constructing the Map: MapLibre measures its container at
    // construction, and a display:none container gives it zero size — the map
    // then never fires 'load' and paints nothing.
    $("map-wrap").hidden = false;
    // Only go two-column once there is actually a map to put in the second one.
    $("split").classList.add("side-by-side");
    document.querySelector("main").classList.add("wide");
    // Browsing (arrived via a cross-region pan) or a pinned browse
    // (shared planner URLs carry pin/to but no ?at=): open the map fully.
    if (browsing || pinnedBrowse) {
      $("map-empty").hidden = true;
      $("map-caption").hidden = false;
      $("map-wrap").classList.remove("awaiting");
    }

    // {metadata: true} is required: the style's source uses `url:`, so MapLibre
    // asks the protocol for TileJSON. Without this flag pmtiles ignores that
    // request — the promise never settles, and the style hangs with no error.
    maplibregl.addProtocol("pmtiles", new pmtiles.Protocol({ metadata: true }).tile);
    // The style is one hand-written file; only the basemap archive differs per
    // region, so fetch the style and point its source at this region's pmtiles.
    // ?v bumped whenever the style schema changes. Browsers heuristically
    // cached this JSON before it was served no-cache, and a stale style from
    // the old basemap schema fails layer-by-layer against the new tiles —
    // water happened to render (both schemas have a "water" layer), roads and
    // labels silently didn't. A new URL is a guaranteed cache miss.
    const style = await (await fetch("/static/map-style.json?v=3")).json();
    style.sources.omt.url = "pmtiles://" + cfg.basemap_url;
    map = new maplibregl.Map({
      container: "map",
      style,
      // The handed-over camera when arriving from a pan swap; otherwise the
      // region's city until a stop is chosen.
      center: atParam ? [atParam.lon, atParam.lat]
            : pinParam ? [pinParam.lon, pinParam.lat] : cfg.center,
      zoom: atParam ? atParam.zoom : pinParam ? 15 : 11,
      attributionControl: { compact: true },
    });
    window.__map = map;   // debug/UI-test handle (see also ?mapdebug=1)
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 120 }), "bottom-left");
    // A bad style silently yields a blank map: MapLibre reports it here and
    // nowhere else, and a style error stops 'load' firing at all, so every
    // layer we add in that handler never exists. Surface it rather than let
    // the map look merely empty.
    map.on("error", (e) => {
      const msg = (e && e.error && e.error.message) || "map error";
      console.error("[map]", msg);
      const el = $("map-status");
      if (el) el.textContent = `map: ${msg}`;
    });

    // Sanity radius per region: pan the map from one city into another and
    // the providers swap underneath — once the centre comes within
    // REGION_RADIUS_KM of another region's home city, hand the camera over.
    // Every moveend is checked: our own programmatic moves (fit, resize,
    // ping) never leave the region, so only a real cross-country pan can
    // trigger it. The zoom guard keeps a zoomed-out whole-country view from
    // swapping under the cursor before the user has picked a city.
    const REGION_RADIUS_KM = 150;
    const haversineKm = (la1, lo1, la2, lo2) => {
      const rad = Math.PI / 180;
      const a = Math.sin((la2 - la1) * rad / 2) ** 2
              + Math.cos(la1 * rad) * Math.cos(la2 * rad)
              * Math.sin((lo2 - lo1) * rad / 2) ** 2;
      return 2 * 6371 * Math.asin(Math.sqrt(a));
    };
    // Whether the move in flight is the user's own (drag / wheel / pinch).
    // Programmatic moves never carry a DOM event; each gesture resets it.
    let userDrove = false;
    map.on("movestart", (e) => { userDrove = Boolean(e.originalEvent); });
    map.on("moveend", () => {
      // With a stop on the board, only the user's own pan can hand over, and
      // only once they've left the stop's area far behind. Regions overlap —
      // several qld towns (Stradbroke, Kilcoy, Maleny, Toowoomba, …) sit
      // within 150 km of Brisbane, so a qld board's own fit-to-stop used to
      // hand the camera to seq and dump the stop the user had just picked;
      // an unconditional `if (stopId) return` fixed that but also killed
      // panning from one city into another whenever a board was open — the
      // map just ran off the region's basemap into blank void.
      if (map.getZoom() < 7) return;
      const c = map.getCenter();
      if (stopId) {
        if (!userDrove) return;
        const s = lastData?.stop;
        if (!s || s.stop_lat == null) return;
        if (haversineKm(c.lat, c.lng, s.stop_lat, s.stop_lon) <= REGION_RADIUS_KM)
          return;   // still browsing around the viewed stop: never steal it
      } else if (pinParam
          && haversineKm(c.lat, c.lng, pinParam.lat, pinParam.lon) <= REGION_RADIUS_KM) {
        // Browsing around a dropped address pin: its region was chosen by
        // nearest-stop (a Toowoomba pin is qld even though Brisbane's centre
        // is nearer) — don't second-guess it until the user leaves the area.
        return;
      }
      let best = null, bestD = Infinity;
      for (const r of regionList) {
        if (!r.center) continue;
        const d = haversineKm(c.lat, c.lng, r.center[1], r.center[0]);
        if (d < bestD) { bestD = d; best = r; }
      }
      if (best && best.id !== region && bestD <= REGION_RADIUS_KM) {
        switchRegion(best.id,
          `${c.lng.toFixed(5)},${c.lat.toFixed(5)},${map.getZoom().toFixed(2)}`);
      }
    });

    map.on("load", () => {
      if (pinParam) {
        // The searched address — amber, like the goose.
        new maplibregl.Marker({ color: "#f0b429" })
          .setLngLat([pinParam.lon, pinParam.lat]).addTo(map);
      }
      map.addSource("vehicles", { type: "geojson", data: emptyFC() });
      map.addSource("ghosts", { type: "geojson", data: emptyFC() });
      map.addSource("stop", { type: "geojson", data: emptyFC() });
      map.addSource("landmarks", { type: "geojson", data: emptyFC() });
      map.addSource("all-stops", { type: "geojson", data: emptyFC() });
      map.addSource("routes", { type: "geojson", data: emptyFC() });
      map.addSource("walklines", { type: "geojson", data: emptyFC() });

      // The path each tracked vehicle is following, in that vehicle's colour.
      // Bottom of the stack: it is context for the markers, not the subject.
      map.addLayer({
        id: "routes", type: "line", source: "routes",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
          "line-color": ["get", "color"],
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 1.5, 15, 4],
          "line-opacity": 0.55,
        },
      });
      // Planner walk legs: dashed grey, above the ride traces. Geometry is
      // the local walking graph's route where available, else a straight line.
      map.addLayer({
        id: "walklines", type: "line", source: "walklines",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: {
          // Each walk carries its own pool colour (the 🚶 "vehicle"),
          // grey only when no colour was assigned.
          "line-color": ["coalesce", ["get", "color"], "#8c98a4"],
          "line-width": ["interpolate", ["linear"], ["zoom"], 10, 1.5, 15, 3],
          "line-dasharray": [1.2, 1.6],
          "line-opacity": 0.9,
        },
      });

      // Every stop in the network, once the user is close enough that street
      // detail is the point (all backstreets legible ≈ z15+). Lazily fetched on
      // first zoom past the threshold; overlap-thinned so a busy interchange
      // stays readable; clickable to select. Below the route landmarks so a
      // traced route's own stops win any tie.
      map.addLayer({
        id: "all-stops", type: "symbol", source: "all-stops",
        minzoom: 15,
        layout: {
          "icon-image": ["get", "icon"],
          // Stations slightly larger, and placed FIRST (lower sort key wins
          // collisions): a station sits exactly where bus stops cluster, and
          // without priority the overlap thinning can drop the 🏫 in favour of
          // an adjacent 🚏. NOTE: the zoom interpolate must be the OUTERMOST
          // expression — a feature `case` wrapped around it fails validation
          // and MapLibre silently drops the whole layer.
          "icon-size": ["interpolate", ["linear"], ["zoom"],
            15, ["case", ["==", ["get", "rt"], 2], 0.7, 0.55],
            17, ["case", ["==", ["get", "rt"], 2], 1.1, 0.9]],
          "symbol-sort-key": ["case", ["==", ["get", "rt"], 2], 0, 1],
          // Near-coincident stops carry a computed offset so they fan out into
          // a row instead of colliding (see maybeLoadAllStops).
          "icon-offset": ["coalesce", ["get", "off"], ["literal", [0, 0]]],
          "icon-anchor": "bottom",
          "icon-allow-overlap": false,
          "icon-padding": 2,
        },
      });

      // The selected route's stops (and the viewed stop's across-the-road
      // pairs), in grey. Drawn above all-stops so a traced route's own stops
      // win any tie. Stations get no special layer — they are stops like any
      // other, in all-stops past zoom 15 and here when on a traced route.
      map.addLayer({
        id: "landmarks", type: "symbol", source: "landmarks",
        layout: {
          "icon-image": ["get", "icon"],
          "icon-size": ["interpolate", ["linear"], ["zoom"], 11, 0.6, 15, 1.05],
          "icon-anchor": "bottom",
          // Unlike the vehicles, these may crowd: let MapLibre thin them out.
          "icon-allow-overlap": false,
          "icon-padding": 2,
        },
      });

      // Ghosts: timetable-estimated positions for board trips with no live
      // GPS. Drawn with exactly the same weight as the live dots — the map
      // no longer distinguishes scheduled from live (the halo-ring-for-
      // estimated idea was dubious, and the ring is now the off-screen edge
      // marker's shape); the board's 🛜/📅 column carries that fact.
      map.addLayer({
        id: "ghost-ping", type: "circle", source: "ghosts",
        filter: PING_OFF,
        paint: {
          "circle-radius": 10,
          "circle-color": ["get", "color"],
          "circle-opacity": 0.35,
          "circle-stroke-width": 2,
          "circle-stroke-color": ["get", "color"],
          "circle-stroke-opacity": 0.9,
        },
      });
      map.addLayer({
        id: "ghost-dot", type: "symbol", source: "ghosts",
        layout: {
          "icon-image": ["get", "icon"],
          "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.9, 15, 1.5],
          "icon-allow-overlap": true,
          // Always drawn, but must not BLOCK the street furniture: a marker
          // sitting at a stop would otherwise suppress the nearby stop icons
          // on the overlap-thinned layers (a station right beside the viewed
          // stop was losing that collision and vanishing).
          "icon-ignore-placement": true,
        },
      });
      map.addLayer({
        id: "ghost-label", type: "symbol", source: "ghosts",
        layout: {
          // "~" = estimated: unambiguous, and cheaper than any ring was.
          "text-field": ["concat", "~", ["get", "minutes"], " min"],
          "text-font": ["Noto Sans Medium"],
          "text-size": 11, "text-offset": [0, 2.3],
          "text-allow-overlap": false,
        },
        paint: {
          "text-color": ["coalesce", ["get", "color"], "#c9d4de"],
          "text-halo-color": "#0c1013", "text-halo-width": 1.4,
        },
      });

      map.addLayer({
        id: "stop-ring", type: "symbol", source: "stop",
        layout: {
          "icon-image": ["get", "icon"],
          "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.975, 15, 1.575],
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,   // see ghost-dot: never blocks stops
          "icon-anchor": "bottom",   // the marker sits on the stop, not over it
        },
      });
      // Expanding ring used to ping one vehicle. Below the icons so it never
      // obscures them; filtered to nothing until a ping is requested.
      map.addLayer({
        id: "vehicle-ping", type: "circle", source: "vehicles",
        filter: PING_OFF,
        paint: {
          "circle-radius": 10,
          "circle-color": ["get", "color"],
          "circle-opacity": 0.35,
          "circle-stroke-width": 2,
          "circle-stroke-color": ["get", "color"],
          "circle-stroke-opacity": 0.9,
        },
      });

      map.addLayer({
        id: "vehicle-dot", type: "symbol", source: "vehicles",
        layout: {
          // The mode emoji, tinted to match the board row's badge and stripe.
          "icon-image": ["get", "icon"],
          "icon-size": ["interpolate", ["linear"], ["zoom"], 10, 0.9, 15, 1.5],
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,   // see ghost-dot: never blocks stops
        },
      });
      map.addLayer({
        id: "vehicle-label", type: "symbol", source: "vehicles",
        layout: {
          // Minutes-away is what ties a dot to its row at a glance; the route
          // number is often identical across several vehicles here.
          "text-field": ["concat", ["get", "minutes"], " min"],
          "text-font": ["Noto Sans Medium"],
          "text-size": 11,
          "text-offset": [0, 2.3],
          "text-allow-overlap": false,
        },
        paint: {
          "text-color": ["coalesce", ["get", "color"], "#c9d4de"],
          "text-halo-color": "#0c1013", "text-halo-width": 1.4,
        },
      });

      map.on("click", "vehicle-dot", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup({ closeButton: false, offset: 12 })
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(
            `<div class="pop-route">${p.route ?? ""} · ${p.headsign ?? ""}</div>` +
            `<div class="pop-sub">${p.minutes} min away${p.age ? " · seen " + p.age + "s ago" : ""}</div>`)
          .addTo(map);
        flashRow(p.trip);
        selectRoute(p.trip);
      });

      // Same as a vehicle click, but the popup owns up to being an estimate.
      map.on("click", "ghost-dot", (e) => {
        const p = e.features[0].properties;
        new maplibregl.Popup({ closeButton: false, offset: 12 })
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(
            `<div class="pop-route">${p.route ?? ""} · ${p.headsign ?? ""}</div>` +
            `<div class="pop-sub">~${p.minutes} min · estimated from timetable (no live GPS)</div>`)
          .addTo(map);
        flashRow(p.trip);
        selectRoute(p.trip);
      });

      // One handler decides what a map click does, so overlapping markers
      // resolve deterministically. Two per-layer handlers used to both fire
      // when a bus stop and an always-on station overlapped, and the station's
      // won — so the bus stop "did nothing". Priority now: a vehicle/ghost keeps
      // its own popup handler; else a route bus stop beats a background station
      // (you are clicking the stop you traced); else empty map clears the route.
      const stopLayers = ["landmarks", "all-stops"];
      map.on("click", (e) => {
        // Vehicles and ghosts have their own handlers below; leave those to them.
        if (map.queryRenderedFeatures(e.point, { layers: ["vehicle-dot", "ghost-dot"] }).length) return;
        const stops = map.queryRenderedFeatures(e.point, { layers: stopLayers });
        if (stops.length) {
          const pick = stops.find((f) => f.layer.id === "landmarks") || stops[0];
          if (pick.properties.stop_id)
            selectStop(pick.properties.stop_id, pick.properties.region);
          return;
        }
        if (selectedTrip) selectRoute(selectedTrip);   // empty map → clear route
      });
      for (const lyr of ["vehicle-dot", "ghost-dot", ...stopLayers]) {
        map.on("mouseenter", lyr, () => map.getCanvas().style.cursor = "pointer");
        map.on("mouseleave", lyr, () => map.getCanvas().style.cursor = "");
      }

      // Hovering a stop names it: one shared tooltip that follows the
      // cursor from stop to stop and vanishes on leave. setText keeps the
      // feed-supplied name inert. (No hover on touch devices — tapping
      // already opens the stop's board.)
      const stopTip = new maplibregl.Popup({
        closeButton: false, closeOnClick: false, offset: 12,
      });
      for (const lyr of stopLayers) {
        map.on("mousemove", lyr, (e) => {
          const f = e.features && e.features[0];
          const name = f && (f.properties.name || f.properties.stop_name);
          if (!name) return;
          stopTip.setLngLat(f.geometry.coordinates).setText(name).addTo(map);
        });
        map.on("mouseleave", lyr, () => stopTip.remove());
      }

      // Only a move carrying a DOM event is the user taking control — a drag,
      // a wheel, a pinch. Testing `programmatic` instead looked equivalent but
      // was not: map.resize() below fires movestart with the flag clear, which
      // switched auto-fit off during startup and left it off forever. The cost
      // is that the +/- buttons no longer disable auto-fit, which is the far
      // less annoying failure.
      map.on("movestart", (e) => { if (e.originalEvent) autoFit = false; });
      map.on("moveend", () => { programmatic = false; });
      // Edge markers track the viewport continuously — a pan or zoom changes
      // which vehicles are off-screen and where their arrows point.
      map.on("move", syncEdgeMarkers);
      map.on("resize", syncEdgeMarkers);

      mapReady = true;
      cameraMove(() => map.resize());
      map.on("zoomend", maybeLoadAllStops);
      maybeLoadAllStops();  // in case the map starts past the threshold
      loadPinSurrounds();   // pin present: draw + fit its surrounding stops
      if (planData) drawPlan();   // a plan booted before the map was ready
      if (lastData) updateMap(lastData);
    });

    // ?mapdebug=1 — ground-truth probe, run in the viewer's own browser (the
    // dev harness cannot render MapLibre at all). On every idle it logs which
    // style is actually loaded and how many features each basemap layer really
    // rendered. Console, not the caption — the 15s poll overwrites the caption.
    if (new URLSearchParams(location.search).get("mapdebug")) {
      map.on("idle", () => {
        const s = map.getStyle();
        const counts = {};
        for (const id of ["water", "road-major", "road-secondary", "road-minor",
                          "busway", "rail", "place", "landcover-green",
                          "all-stops", "landmarks", "vehicle-dot", "ghost-dot"]) {
          try {
            counts[id] = map.getLayer(id)
              ? map.queryRenderedFeatures({ layers: [id] }).length
              : "NO-LAYER";
          } catch (e) { counts[id] = "ERR:" + e.message; }
        }
        console.log(`[mapdebug] style=${s.name} zoom=${map.getZoom().toFixed(1)}`, counts);
      });
    }
  }

  const emptyFC = () => ({ type: "FeatureCollection", features: [] });

  // A merged board can carry rows borrowed from a sibling region (the XPT on
  // Central's suburban board) — every per-trip fetch must go to the region
  // the row came from, not the board's.
  const tripRegion = (tripId) =>
    (lastData?.departures || []).find((d) => d.trip_id === tripId)?.region || region;
  const apiIn = (rgn, path) => `/api/r/${rgn || region}${path}`;

  // Route geometry is static for the life of a timetable, so fetch each shape
  // once and keep it. `pending` stops a slow fetch being issued repeatedly by
  // successive polls.
  const shapeCache = new Map(), shapePending = new Set();
