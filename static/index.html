  async function ensureShape(shapeId, rgn) {
    if (!shapeId || shapeCache.has(shapeId) || shapePending.has(shapeId)) return;
    shapePending.add(shapeId);
    try {
      const res = await fetch(apiIn(rgn, `/shape/${encodeURIComponent(shapeId)}`));
      if (res.ok) {
        shapeCache.set(shapeId, (await res.json()).points);
        if (lastData) drawRoutes(lastData);   // redraw once it lands
        if (planData) drawPlan();             // planner legs wait on shapes too
      } else {
        shapeCache.set(shapeId, null);        // no geometry; stop asking
      }
    } catch {
      /* leave it unset so a later poll can retry */
    } finally {
      shapePending.delete(shapeId);
    }
  }

  // Nothing is drawn until a service is picked. Showing every route at once
  // stacked identical paths on top of each other and told you nothing; one
  // route, on demand, is what is actually useful. The same goes for the stops
  // along it — 191 grey pins for a station board was clutter, not context.
  let selectedTrip = null;

  const tripStopsCache = new Map(), tripStopsPending = new Set();

  async function ensureTripStops(tripId) {
    if (!tripId || tripStopsCache.has(tripId) || tripStopsPending.has(tripId)) return;
    tripStopsPending.add(tripId);
    try {
      // ?v bumped on schema change (v2: scheduled times added) — the
      // response is cached for a day, same lesson as all-stops.
      const res = await fetch(
        apiIn(tripRegion(tripId), `/trip-stops/${encodeURIComponent(tripId)}?v=2`));
      tripStopsCache.set(tripId, res.ok ? (await res.json()).stops : null);
      drawLandmarks();
      renderTripPanel();
      if (planData) drawPlan();   // a planner leg was waiting on this trip
    } catch {
      /* leave unset so a later selection retries */
    } finally {
      tripStopsPending.delete(tripId);
    }
  }

  // Grey landmarks: the selected route's stops (when one is traced) plus the
  // paired stops across the road from the viewed stop (always — "going the
  // other way" is the next thing a rider looks for). Never the viewed stop
  // itself; that is drawn separately in white.
  function drawLandmarks() {
    if (!mapReady || !map.getSource("landmarks")) return;
    const routeStops = (selectedTrip && tripStopsCache.get(selectedTrip)) || [];
    const paired = lastData?.paired || [];
    const selfId = lastData?.stop?.stop_id;
    // A traced trip may belong to a sibling region (an XPT on Central's
    // board): its stops must open in *that* region, so each landmark
    // remembers where it came from.
    const routeRgn = selectedTrip ? tripRegion(selectedTrip) : region;
    const seen = new Set();
    const features = [];
    for (const [l, rgn] of [
      ...routeStops.map((l) => [l, routeRgn]),
      ...paired.map((l) => [l, region]),
      ...pinStops.map((l) => [l, l.region || region]),
    ]) {
      if (l.stop_id === selfId || seen.has(l.stop_id)) continue;
      seen.add(l.stop_id);
      features.push({
        type: "Feature",
        geometry: { type: "Point", coordinates: [l.lon, l.lat] },
        properties: {
          stop_id: l.stop_id,   // click a landmark to view it as the stop
          region: rgn,
          name: l.stop_name,
          icon: ensureVehicleIcon(landmarkGlyph(l.route_type), LANDMARK_INK),
        },
      });
    }
    map.getSource("landmarks").setData({ type: "FeatureCollection", features });
  }

  // Hide only the stop being viewed from the all-stops layer — it already has
  // the white viewed-stop marker, and a grey one underneath just doubles up.
  function syncRailStationFilter() {
    if (!mapReady) return;
    if (map.getLayer("all-stops")) {
      map.setFilter("all-stops", ["!=", ["get", "stop_id"], stopId || ""]);
    }
  }

  // Every stop in the network, fetched once, lazily — only when the user first
  // zooms in far enough for the all-stops layer (minzoom 15) to matter. ~1 MB
  // of GeoJSON that most sessions never need has no place in the initial load.
  let allStopsLoaded = false, allStopsLoading = false;
  function maybeLoadAllStops() {
    if (allStopsLoaded || allStopsLoading || !mapReady) return;
    if (map.getZoom() < 14.5) return;   // fetch just ahead of the threshold
    allStopsLoading = true;
    // ?v bumped when the payload schema changes — the endpoint is cached for a
    // day (rightly: 1-2.5 MB, changes weekly), so a schema change served under
    // the same URL leaves clients on the old shape until the cache expires.
    // v2: rail stations included, tagged rt=2.
    // ?v bumped whenever the payload's meaning changes (v3: parent stations
    // inherit their children's dominant mode — ferry terminals stopped
    // reading as bus stops); the response is cached for 24 h.
    fetch(api("/all-stops?v=3"))
      .then((r) => r.json())
      .then((d) => {
        const stops = d.stops || [];
        // Near-coincident stops (a station beside its bus interchange,
        // kerbside pairs) would collide and thin each other out. Cluster by
        // true proximity — union-find over a coarse cell index, linking stops
        // within ~28 m even across cell boundaries (a plain grid hash missed
        // exactly the station-next-to-stop case) — then fan each cluster out
        // into a little row so neighbours sit next to each other instead of
        // fighting for one spot. Offsets are icon pixels (scaled by icon-size).
        const CELL = 0.0004, LINK_M = 28;
        const cells = new Map();
        stops.forEach((s, i) => {
          const key = `${Math.round(s.lat / CELL)},${Math.round(s.lon / CELL)}`;
          (cells.get(key) || cells.set(key, []).get(key)).push(i);
        });
        const root = stops.map((_, i) => i);
        const find = (i) => root[i] === i ? i : (root[i] = find(root[i]));
        const metres = (a, b) => {
          const kx = 111320 * Math.cos(a.lat * Math.PI / 180);
          return Math.hypot((a.lon - b.lon) * kx, (a.lat - b.lat) * 110540);
        };
        stops.forEach((s, i) => {
          const cy = Math.round(s.lat / CELL), cx = Math.round(s.lon / CELL);
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            for (const j of cells.get(`${cy + dy},${cx + dx}`) || []) {
              if (j > i && metres(s, stops[j]) <= LINK_M) root[find(j)] = find(i);
            }
          }
        });
        const groups = new Map();
        stops.forEach((s, i) => {
          const r = find(i);
          (groups.get(r) || groups.set(r, []).get(r)).push(s);
        });
        const offsetOf = new Map();
        for (const g of groups.values()) {
          if (g.length < 2) continue;
          g.sort((a, b) => (a.route_type ?? 9) - (b.route_type ?? 9)
                        || String(a.stop_id).localeCompare(String(b.stop_id)));
          g.forEach((s, i) => {
            // rows of three, centred
            const row = Math.floor(i / 3), col = i % 3, n = Math.min(g.length - row * 3, 3);
            offsetOf.set(s.stop_id, [(col - (n - 1) / 2) * 30, row * 30]);
          });
        }
        map.getSource("all-stops").setData({
          type: "FeatureCollection",
          features: stops.map((s) => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [s.lon, s.lat] },
            properties: {
              stop_id: s.stop_id,
              name: s.name,
              rt: Number(s.route_type),
              off: offsetOf.get(s.stop_id) || [0, 0],
              icon: ensureVehicleIcon(landmarkGlyph(s.route_type), LANDMARK_INK),
            },
          })),
        });
        allStopsLoaded = true;
        syncRailStationFilter();
      })
      .catch(() => { allStopsLoading = false; });   // retry on a later zoom
  }

  function drawRoutes(data) {
    if (!mapReady || !map.getSource("routes")) return;
    if (!selectedTrip) {
      map.getSource("routes").setData(emptyFC());
      return;
    }
    const row = (data.departures || []).find((d) => d.trip_id === selectedTrip);
    const pts = row && shapeCache.get(row.shape_id);
    if (!pts) {
      if (row) ensureShape(row.shape_id, row.region);
      map.getSource("routes").setData(emptyFC());
      return;
    }
    map.getSource("routes").setData({
      type: "FeatureCollection",
      features: [{
        type: "Feature",
        geometry: { type: "LineString", coordinates: pts },
        properties: { color: (data.__colors || {})[selectedTrip] || "#3fb950" },
      }],
    });
  }

  // Clicking the same service again clears it.
  function selectRoute(tripId) {
    selectedTrip = selectedTrip === tripId ? null : tripId;
    if (selectedTrip) {
      // Start fetching now rather than waiting on the map's draw pass, so both
      // are usually cached by the time they are wanted.
      const d = (lastData?.departures || []).find((x) => x.trip_id === selectedTrip);
      if (d) ensureShape(d.shape_id, d.region);
      ensureTripStops(selectedTrip);
      refreshTripTimes(selectedTrip);
    }
    document.querySelectorAll(".row.selected")
      .forEach((r) => r.classList.remove("selected"));
    if (selectedTrip) {
      const el = document.querySelector(`.row[data-trip="${CSS.escape(selectedTrip)}"]`);
      if (el) el.classList.add("selected");
    }
    if (lastData) drawRoutes(lastData);
    drawLandmarks();
    renderTripPanel();
  }

  // Live per-stop arrivals for the selected trip; refetched on the board's
  // poll cadence while a trip is selected. Absence just means the panel
  // shows the timetable alone.
  const tripTimesCache = new Map();
  async function refreshTripTimes(tripId) {
    if (!tripId) return;
    try {
      const res = await fetch(
        apiIn(tripRegion(tripId), `/trip-times/${encodeURIComponent(tripId)}`));
      if (res.ok) {
        tripTimesCache.set(tripId, await res.json());
        renderTripPanel();
      }
    } catch { /* scheduled times still render */ }
  }

  // GTFS wall-clock "HH:MM:SS" (hours may exceed 24 after midnight) plus a
  // delay in seconds → "HH:MM" for display.
  const schedPlus = (hms, plusS) => {
    const [h, m, s] = String(hms).split(":").map(Number);
    const t = h * 3600 + m * 60 + (s || 0) + (plusS || 0);
    const hh = String(Math.floor(t / 3600) % 24).padStart(2, "0");
    return `${hh}:${String(Math.floor((t % 3600) / 60)).padStart(2, "0")}`;
  };

  // The selected service's full calling pattern, overlaid on the arrivals
  // list (the badge column stays visible). Rebuilt on every board render —
  // the board render wipes #board — so scroll position is carried across
  // rebuilds of the same trip.
  let panelTripRendered = null;
  function renderTripPanel() {
    const board = $("board");
    const old = board.querySelector(".trip-panel");
    const keepScroll = old && panelTripRendered === selectedTrip
      ? old.querySelector(".tstops").scrollTop : null;
    if (old) old.remove();
    panelTripRendered = null;
    board.style.minHeight = "";        // reclaimed whenever the panel closes
    if (!selectedTrip || !stopId) return;
    const d = (lastData?.departures || []).find((x) => x.trip_id === selectedTrip);
    if (!d) return;                    // service has left the board
    const stops = tripStopsCache.get(selectedTrip);
    const lt = tripTimesCache.get(selectedTrip) || {};
    const live = lt.stops || {};
    const delays = lt.delays || [];   // sorted (stop_sequence, delay) pairs
    // An update applies to every later stop until the next update — the same
    // propagation the board applies for feeds publishing only the next stop.
    const propDelay = (seq) => {
      let d = null;
      for (const [s, dl] of delays) { if (s <= seq) d = dl; else break; }
      return d;
    };
    const vcolor = (lastData.__colors || {})[selectedTrip] || "#3fb950";
    // 24-hour, to match the schedule-derived times beside it in the list.
    const fmtEpoch = (t) => new Date(t * 1000)
      .toLocaleTimeString("en-GB", {hour12: false, hour: "2-digit",
                                    minute: "2-digit",
                                    ...(regionTz ? {timeZone: regionTz} : {})});
    // Region wall-clock now, for greying stops already served. String
    // comparison is enough at HH:MM granularity; after-midnight rows
    // (GTFS hours ≥ 24 map past 00:00) may briefly mis-grey — harmless.
    const nowHM = new Date().toLocaleTimeString("en-GB",
      {hour12: false, hour: "2-digit", minute: "2-digit",
       ...(regionTz ? {timeZone: regionTz} : {})});
    const nowS = Date.now() / 1000;
    const hereId = d.stop_id || stopId;   // the boarding platform, not the parent
    let items, keptStops = [];
    if (!stops) {
      items = `<div class="tstop"><span class="tname">Loading stops…</span></div>`;
    } else {
      const recs = stops.map((s) => {
        const lr = live[s.stop_id];
        const delay = lr?.delay ?? propDelay(s.seq);
        let shown, isLive = false, past;
        if (lr?.t) {
          shown = fmtEpoch(lr.t);
          isLive = true;
          past = lr.t < nowS - 30;
        } else if (s.sched) {
          isLive = delay !== null && delay !== undefined;
          shown = schedPlus(s.sched, isLive ? delay : 0);
          past = shown < nowHM && Number(s.sched.split(":")[0]) < 24;
        } else {
          shown = "";
          past = false;
        }
        return { s, lr, shown, isLive, past: past && s.stop_id !== hereId };
      });
      // History is context, not the point: keep only the three most recently
      // served stops, and say how many came before rather than cutting
      // silently. (The viewed stop is never "past", so it is never dropped.)
      const pastIdx = recs.map((r, i) => (r.past ? i : -1)).filter((i) => i >= 0);
      const hideSet = new Set(pastIdx.slice(0, -3));
      const kept = recs.filter((_, i) => !hideSet.has(i));
      keptStops = kept.map((r) => r.s);
      items = (hideSet.size
          ? `<div class="tmore">&ctdot; ${hideSet.size} earlier stops</div>` : "")
        + kept.map(({ s, lr, shown, past }) => {
            const cls = ["tstop",
                         lr?.skipped && "skipped",
                         s.stop_id === hereId && "here",
                         past && "past"]
                        .filter(Boolean).join(" ");
            return `<div class="${cls}"><span class="tname">${s.stop_name}</span>` +
                   `<span class="ttime">${lr?.skipped ? "skipped" : shown}</span></div>`;
          }).join("");
    }
    const panel = document.createElement("div");
    panel.className = "trip-panel";
    panel.style.setProperty("--vcolor", vcolor);
    // Sit just below the board heading — the timeline must not cover which
    // stop it belongs to. (Height measured live: long names wrap.)
    const bh = board.querySelector(".board-head");
    if (bh) panel.style.top = `${bh.offsetTop + bh.offsetHeight}px`;
    // The header speaks the board's language: the service's badge, then the
    // same 🛜/📅 source mark its row carries (the panel covers that column).
    const routeLabel = d.route ?? "";
    const numClass = routeLabel.length > 8 ? "num xwide"
                   : routeLabel.length > 4 ? "num wide" : "num";
    panel.innerHTML = `
      <div class="tp-head">
        <div class="badge" style="color:${vcolor}">
          <span class="mode">${asText(MODE_EMOJI[d.route_type] ?? DEFAULT_EMOJI)}</span>
          <span class="${numClass}">${routeLabel}</span>
        </div>
        <span class="tp-src" title="${d.realtime ? "Live Location Feed" : "Scheduled/Estimated"}"
              >${asText(d.realtime ? MARK_LIVE : MARK_SCHEDULED)}</span>
        <span class="tp-dest">→ ${d.headsign ?? ""}</span>
        <button class="tp-close" aria-label="Close stop list">&times;</button>
      </div>
      <div class="tstops"><div class="ttrack">${items}</div></div>`;
    panel.querySelector(".tp-close").addEventListener("click", (ev) => {
      ev.stopPropagation();
      selectRoute(selectedTrip);       // toggles the selection off
    });
    // The rows underneath must not also react to clicks on the panel.
    panel.addEventListener("click", (ev) => ev.stopPropagation());
    board.appendChild(panel);
    const list = panel.querySelector(".tstops");

    // Side by side with the map, the stop list may outgrow the arrivals
    // list: stretch the board to the map's height so the timeline uses the
    // space instead of scrolling inside a short strip. Stacked (phone)
    // layout keeps the board height — growing it would just push the map
    // out of reach.
    // The class alone is not enough — it is set whenever a map exists, but
    // the two-column layout only engages at the stylesheet's breakpoint.
    const wrap = $("map-wrap");
    if ($("split").classList.contains("side-by-side")
        && window.matchMedia("(min-width: 900px)").matches && !wrap.hidden) {
      const mh = wrap.getBoundingClientRect().height;
      if (mh > board.getBoundingClientRect().height) {
        board.style.minHeight = `${mh}px`;
      }
    }

    // The selected service's vehicle, hung on the line at its spot: the
    // position is projected onto the stop-to-stop polyline, and the winning
    // segment's fraction is mapped onto the rendered rows. (One vehicle
    // only, by design — every stop shows one arrival time, so a second
    // vehicle on the timeline read as a contradiction.) No live GPS does
    // not mean no marker: fall back to the same estimated position the map
    // draws as a ghost — a trip can have live TIMES (TripUpdates) yet no
    // live POSITION (VehiclePositions); the 348s do exactly that.
    let vehs = (keptStops.length > 1 && lt.vehicles) || [];
    if (!vehs.length && keptStops.length > 1) {
      const g = (lastData.__ghosts || lastData.ghosts || [])
        .find((x) => x.trip_id === selectedTrip);
      if (g) vehs = [{ trip_id: g.trip_id, lat: g.lat, lon: g.lon }];
    }
    if (vehs.length) {
      const track = panel.querySelector(".ttrack");
      // Projection runs over the RENDERED stops (history beyond three served
      // stops is collapsed), so fractions and .tstop rows stay 1:1.
      const stops_ = keptStops;
      const rows = [...track.querySelectorAll(".tstop")];
      const glyph = MODE_EMOJI[d.route_type] ?? DEFAULT_EMOJI;
      const kx = 111320 * Math.cos(stops_[0].lat * Math.PI / 180), ky = 110540;
      const yOf = (i) => rows[i].offsetTop + rows[i].offsetHeight / 2;
      for (const v of vehs) {
        let best = null;
        for (let i = 0; i < stops_.length - 1; i++) {
          const ax = stops_[i].lon * kx,     ay = stops_[i].lat * ky;
          const bx = stops_[i + 1].lon * kx, by = stops_[i + 1].lat * ky;
          const px = v.lon * kx,            py = v.lat * ky;
          const dx = bx - ax, dy = by - ay;
          const t = Math.max(0, Math.min(1,
            ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
          const qx = ax + t * dx - px, qy = ay + t * dy - py;
          const d2 = qx * qx + qy * qy;
          if (!best || d2 < best.d2) best = { frac: i + t, d2 };
        }
        // A route-mate more than ~10 km off this trip's line is running a
        // pattern these stops don't describe — placing it would just lie.
        if (!best || best.d2 > 10000 * 10000) continue;
        const i = Math.min(Math.floor(best.frac), rows.length - 2);
        const el = document.createElement("div");
        el.className = "tveh" + (v.trip_id === selectedTrip ? " me" : "");
        el.style.top = `${yOf(i) + (best.frac - i) * (yOf(i + 1) - yOf(i))}px`;
        el.textContent = asText(glyph);
        track.appendChild(el);
      }
    }

    if (keepScroll !== null) {
      list.scrollTop = keepScroll;
    } else {
      const here = panel.querySelector(".tstop.here");
      if (here) list.scrollTop = here.offsetTop - list.clientHeight / 2;
    }
    panelTripRendered = selectedTrip;
  }

  // MapLibre draws label text from pre-built glyph PBFs, and ours cover latin
  // only — an emoji codepoint simply would not render. So the glyph is
  // rasterised to a canvas in the vehicle's colour and registered as a map
  // image instead. One image per (glyph, colour) pair, made on demand.
  const ICON_PX = 48, ICON_RATIO = 2;

  // Canvas is fed the font through an explicitly constructed FontFace rather
  // than the stylesheet's family. Relying on the @font-face rule means relying
  // on it having been parsed and matched by the time we rasterise — and when it
  // has not been, canvas silently falls back to the system colour-emoji font
  // and bakes a full-colour glyph into the cached image. This also sidesteps
  // the rule's unicode-range, which canvas font matching need not honour.
  const CANVAS_EMOJI = "NotoEmojiCanvas";
  let emojiFontReady = null;
  function loadEmojiFont() {
    if (!emojiFontReady) {
      emojiFontReady = (async () => {
        // ?v matches fonts.css and is bumped with every subset change. This
        // bare-URL load predates the no-cache middleware, so browsers held a
        // heuristically-cached old subset — any glyph added since (🚉) then
        // fell back to the system COLOUR emoji font on the canvas, which is
        // exactly the coloured-map-icons bug. A new URL is a guaranteed miss.
        const ff = new FontFace(CANVAS_EMOJI,
          "url('/static/fonts/NotoEmoji-mode.woff2?v=5')");
        await ff.load();
        document.fonts.add(ff);
      })().catch(() => { /* fall back to whatever canvas picks */ });
    }
    return emojiFontReady;
  }

  function ensureVehicleIcon(glyph, color) {
    const id = `veh-${glyph.codePointAt(0).toString(16)}-${color.replace("#", "")}`;
    if (map.hasImage(id)) return id;

    const c = document.createElement("canvas");
    c.width = c.height = ICON_PX;
    const ctx = c.getContext("2d");
    ctx.font = `${Math.round(ICON_PX * 0.7)}px "${CANVAS_EMOJI}", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    // Dark outline first so the glyph stays legible over any basemap colour.
    ctx.lineJoin = "round";
    ctx.lineWidth = ICON_PX * 0.14;
    ctx.strokeStyle = "#0c1013";
    ctx.strokeText(glyph, ICON_PX / 2, ICON_PX / 2);
    ctx.fillStyle = color;
    ctx.fillText(glyph, ICON_PX / 2, ICON_PX / 2);

    map.addImage(id, ctx.getImageData(0, 0, ICON_PX, ICON_PX), {
      pixelRatio: ICON_RATIO,
    });
    return id;
  }

  // A filter that matches no feature — the ping ring's resting state.
  const PING_OFF = ["==", ["get", "trip"], "␀none"];
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)");

  const FIT_PADDING = 46;   // keeps markers clear of the edges and the controls
  const FIT_MAX_ZOOM = 15;  // stop it diving in when everything is close together

  // --- linking the two views ---------------------------------------------
  let pingRaf = null, pingTimer = null;

  // Board row -> map. Expanding ring on that marker, panning to it first if it
  // has drifted out of view. Works for a live vehicle or an estimated ghost —
  // whichever holds the trip — pinging on that source's own ring layer.
  function pingVehicle(tripId) {
    if (!mapReady || !map.getLayer("vehicle-ping")) return;
    let target = (lastData?.__vehicles || []).find((x) => x.trip_id === tripId);
    let layer = "vehicle-ping";
    if (!target) {
      target = (lastData?.__ghosts || []).find((x) => x.trip_id === tripId);
      layer = "ghost-ping";
    }
    if (!target) return;

    if (!map.getBounds().contains([target.lon, target.lat])) {
      cameraMove(() => map.easeTo({ center: [target.lon, target.lat], duration: 600 }));
    }

    cancelAnimationFrame(pingRaf);
    clearTimeout(pingTimer);
    // Only one ping at a time, on either layer.
    map.setFilter("vehicle-ping", PING_OFF);
    map.setFilter("ghost-ping", PING_OFF);
    map.setFilter(layer, ["==", ["get", "trip"], tripId]);

    if (REDUCED_MOTION.matches) {
      // Static ring instead of a pulse, then clear.
      map.setPaintProperty(layer, "circle-radius", 20);
      map.setPaintProperty(layer, "circle-opacity", 0.3);
      map.setPaintProperty(layer, "circle-stroke-opacity", 0.9);
      pingTimer = setTimeout(() => map.setFilter(layer, PING_OFF), 1600);
      return;
    }

    const START = performance.now(), CYCLE = 850, TOTAL = 2550;
    const step = (t) => {
      const elapsed = t - START;
      if (elapsed > TOTAL) {
        map.setFilter(layer, PING_OFF);
        return;
      }
      const p = (elapsed % CYCLE) / CYCLE;      // 0..1 within each pulse
      map.setPaintProperty(layer, "circle-radius", 9 + p * 26);
      map.setPaintProperty(layer, "circle-opacity", 0.32 * (1 - p));
      map.setPaintProperty(layer, "circle-stroke-opacity", 0.95 * (1 - p));
      pingRaf = requestAnimationFrame(step);
    };
    pingRaf = requestAnimationFrame(step);
  }

  // --- disruption alerts ---------------------------------------------------
  // Alert text comes from the feed, so the popup is built with DOM APIs — never
  // innerHTML — to keep any markup in the text inert.
  function showAlerts(ids) {
    const map = lastData?.alerts || {};
    const box = $("alert-box");
    box.innerHTML = "";
    const h = document.createElement("h2");
    const g = document.createElement("span");
    g.className = "glyph";
    g.textContent = asText(MARK_ALERT);
    h.append(g, " Service disruptions");
    box.appendChild(h);
    ids.forEach((i) => {
      const a = map[String(i)];
      if (!a) return;
      const item = document.createElement("div");
      item.className = "alert-item";
      const eff = document.createElement("div");
      eff.className = "effect";
      eff.textContent = a.effect || "";
      const head = document.createElement("div");
      head.className = "head";
      head.textContent = a.header || "";
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = a.description || "";
      item.append(eff, head, body);
      box.appendChild(item);
    });
    const close = document.createElement("button");
    close.className = "alert-close";
    close.textContent = "Close";
    close.onclick = closeAlerts;
    box.appendChild(close);
    $("alert-modal").hidden = false;
    close.focus();
  }

  function closeAlerts() { $("alert-modal").hidden = true; }

  $("alert-modal").addEventListener("click", (e) => {
    if (e.target === $("alert-modal")) closeAlerts();   // backdrop only
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("alert-modal").hidden) closeAlerts();
  });

  // Map -> board row. Flash the matching row and bring it into view.
  let flashTimer = null;
  function flashRow(tripId) {
    const row = document.querySelector(`.row[data-trip="${CSS.escape(tripId)}"]`);
    if (!row) return;
    clearTimeout(flashTimer);
    document.querySelectorAll(".row.flash").forEach((r) => r.classList.remove("flash"));
    void row.offsetWidth;             // restart the animation if it is re-clicked
    row.classList.add("flash");
    row.scrollIntoView({ block: "nearest", behavior: "smooth" });
    flashTimer = setTimeout(() => row.classList.remove("flash"), 2200);
  }

  // Move the camera under our own flag, so the movestart handler does not read
  // it as the user taking over.
  function cameraMove(fn) {
    programmatic = true;
    fn();
  }

  // Frame the stop and every marker — live and estimated alike, since the point
  // is that the board and the map show the same set. Called on each poll, but
  // only actually moves when it needs to: re-animating a map every 15 seconds
  // while someone is reading it is worse than a slightly stale frame.
  function fitView(data, vehicles, ghosts = []) {
    if (!mapReady || (!autoFit && !forceFit)) return;

    const pts = [];
    const { stop_lat: lat, stop_lon: lon } = data.stop;
    if (lat != null && lon != null) pts.push([lon, lat]);
    vehicles.forEach((v) => pts.push([v.lon, v.lat]));
    ghosts.forEach((g) => pts.push([g.lon, g.lat]));
    if (!pts.length) return;

    if (pts.length === 1) {
      if (forceFit) {
        cameraMove(() => map.easeTo({ center: pts[0], zoom: 14, duration: 600 }));
        forceFit = false;
      }
      return;
    }

    const bounds = pts.reduce(
      (b, p) => b.extend(p),
      new maplibregl.LngLatBounds(pts[0], pts[0]),
    );

    if (!forceFit) {
      // Already framed well enough? Leave it alone. Refit when something has
      // moved out of view, or when the view has drifted much wider than needed
      // (a distant vehicle dropping off the board zooms us back in).
      const view = map.getBounds();
      const allVisible = pts.every((p) => view.contains(p));
      const target = map.cameraForBounds(bounds, {
        padding: FIT_PADDING, maxZoom: FIT_MAX_ZOOM,
      });
      const tooWide = target && target.zoom - map.getZoom() > 1.5;
      if (allVisible && !tooWide) return;
    }

    cameraMove(() => map.fitBounds(bounds, {
      padding: FIT_PADDING, maxZoom: FIT_MAX_ZOOM, duration: 700,
    }));
    forceFit = false;
  }

  function updateMap(data) {
    if (!mapReady) return;
    const lat = data.stop.stop_lat, lon = data.stop.stop_lon;

    if (lat != null && lon != null) {
      map.getSource("stop").setData({
        type: "FeatureCollection",
        features: [{
          type: "Feature",
          geometry: { type: "Point", coordinates: [lon, lat] },
          // White: this is the landmark that was searched for.
          properties: {
            icon: ensureVehicleIcon(stopGlyph(data), LANDMARK_SELECTED_INK),
          },
        }],
      });
    }

    drawLandmarks();

    const now = Math.floor(Date.now() / 1000);
    const colors = data.__colors || {};
    // __vehicles is the set trimmed to the rows actually on screen.
    const vehicles = data.__vehicles || data.vehicles || [];
    // route_type rides on the departures, not the vehicles, so look it up.
    const modeOf = {};
    data.departures.forEach((d) => { modeOf[d.trip_id] = d.route_type; });

    map.getSource("vehicles").setData({
      type: "FeatureCollection",
      features: vehicles.map((v) => {
        const color = colors[v.trip_id] || "#3fb950";
        const glyph = MODE_EMOJI[modeOf[v.trip_id]] ?? DEFAULT_EMOJI;
        return {
          type: "Feature",
          geometry: { type: "Point", coordinates: [v.lon, v.lat] },
          properties: {
            trip: v.trip_id,          // links the marker back to its board row
            route: v.route ?? "",
            headsign: v.headsign ?? "",
            minutes: v.minutes,
            color,
            icon: ensureVehicleIcon(glyph, color),
            age: v.timestamp ? now - v.timestamp : null,
          },
        };
      }),
    });

    // Ghosts: drawn identically to the live dots — scheduled-vs-live is the
    // board's 🛜/📅 column's job, not the map's.
    const ghosts = data.__ghosts || data.ghosts || [];
    map.getSource("ghosts").setData({
      type: "FeatureCollection",
      features: ghosts.map((g) => {
        const color = colors[g.trip_id] || "#3fb950";
        const glyph = MODE_EMOJI[modeOf[g.trip_id]] ?? DEFAULT_EMOJI;
        return {
          type: "Feature",
          geometry: { type: "Point", coordinates: [g.lon, g.lat] },
          properties: {
            trip: g.trip_id,
            route: g.route ?? "",
            headsign: g.headsign ?? "",
            minutes: g.minutes,
            color,
            icon: ensureVehicleIcon(glyph, color),
          },
        };
      }),
    });

    drawRoutes(data);
    fitView(data, vehicles, ghosts);
    syncEdgeMarkers();

    const shownCount = data.departures.length - (data.__hidden || 0);
    const live = vehicles.length, est = ghosts.length;
    $("map-status").textContent =
      live + est === 0 ? "no positions for these services"
      : est === 0 ? `${live} of ${shownCount} tracking live`
      : `${live} live · ${est} estimated`;
  }

  // A board vehicle outside the current view still deserves a presence:
  // its marker is clamped to the nearest map edge, with a rim arrow aimed
  // at the real position. Rebuilt wholesale on every map move — the set is
  // at most the board's row count, so this stays cheap.
  function syncEdgeMarkers() {
    const holder = $("edge-markers");
    if (!holder) return;
    if (!mapReady || !lastData || !stopId) { holder.replaceChildren(); return; }
    const w = map.getContainer().clientWidth;
    const h = map.getContainer().clientHeight;
    const M = 26;                     // keeps the whole ring inside the map
    const colors = lastData.__colors || {};
    const modeOf = {};
    lastData.departures.forEach((d) => { modeOf[d.trip_id] = d.route_type; });
    const frag = document.createDocumentFragment();
    const placed = [];                // markers already pinned, for fanning
    for (const v of [...(lastData.__vehicles || []), ...(lastData.__ghosts || [])]) {
      const pt = map.project([v.lon, v.lat]);
      if (pt.x >= 0 && pt.x <= w && pt.y >= 0 && pt.y <= h) continue;
      let x = Math.min(Math.max(pt.x, M), w - M);
      let y = Math.min(Math.max(pt.y, M), h - M);
      // A whole fleet off in one direction clamps to the same spot and
      // stacks. Slide colliders along the edge they are pinned to (wrapping
      // within it); each arrow is aimed from its FINAL spot, so a displaced
      // marker still points at its own vehicle.
      const slideY = x === M || x === w - M;   // on a vertical edge
      for (let guard = 0; guard < 50; guard++) {
        if (!placed.some((p) => Math.hypot(p[0] - x, p[1] - y) < 34)) break;
        if (slideY) {
          y += 34; if (y > h - M) y = M + (y - M) % (h - 2 * M);
        } else {
          x += 34; if (x > w - M) x = M + (x - M) % (w - 2 * M);
        }
      }
      placed.push([x, y]);
      const el = document.createElement("div");
      el.className = "edge-veh";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.setProperty("--vcolor", colors[v.trip_id] || "#3fb950");
      el.style.setProperty("--angle",
        `${Math.atan2(pt.y - y, pt.x - x) * 180 / Math.PI}deg`);
      el.textContent = asText(MODE_EMOJI[modeOf[v.trip_id]] ?? DEFAULT_EMOJI);
      el.title = `${v.route ?? ""} · ${v.headsign ?? ""} · `
               + `${v.estimated ? "~" : ""}${v.minutes} min — show on map`;
      el.addEventListener("click", () => {
        cameraMove(() => map.easeTo({ center: [v.lon, v.lat], duration: 600 }));
        pingVehicle(v.trip_id);
      });
      frag.appendChild(el);
    }
    holder.replaceChildren(frag);
  }

  // --- departures board --------------------------------------------------
  let lastData = null;

  // How many rows fit between the top of the board and the bottom of the
  // viewport. Null until a row has been measured — the first render draws
  // everything, measures, then redraws trimmed.
  let rowHeight = null;

  function fittingRowCount() {
    if (!rowHeight) return null;
    const top = $("board").getBoundingClientRect().top;
    const avail = window.innerHeight - top - BOARD_BOTTOM_GUTTER;
    return Math.max(1, Math.floor(avail / rowHeight));
  }
  const BOARD_BOTTOM_GUTTER = 28;   // breathing room + the status line

  function renderBoard(data) {
    // In a pinned session the SEARCHED ADDRESS stays as the title — it is
    // the user's anchor; the chosen stop is visible on the map and board.
    $("stop-name").textContent =
      (pinParam && pinLabel) ? pinLabel : data.stop.stop_name;
    const board = $("board");
    board.innerHTML = "";
    // Which stop these arrivals belong to — its glyph and name. Matters most
    // in a pinned session, where the titlebar keeps the searched address.
    const head = document.createElement("div");
    head.className = "board-head";
    const bhIcon = document.createElement("span");
    bhIcon.className = "bh-icon";
    bhIcon.textContent = asText(stopGlyph(data));
    const bhName = document.createElement("span");
    bhName.textContent = data.stop.stop_name;
    head.append(bhIcon, bhName);
    board.appendChild(head);
    if (data.departures.length === 0) {
      board.insertAdjacentHTML("beforeend",
        `<div class="empty">No services in the next 90 minutes.</div>`);
    }

    // Show only what fits, and cut the map to match: a marker with no row on
    // screen is exactly the mismatch the vehicles array exists to prevent.
    const limit = fittingRowCount();
    const shown = limit ? data.departures.slice(0, limit) : data.departures;
    const shownIds = new Set(shown.map((d) => d.trip_id));
    const vehicles = (data.vehicles || []).filter((v) => shownIds.has(v.trip_id));
    const ghosts = (data.ghosts || []).filter((g) => shownIds.has(g.trip_id));

    // One colour per departure, shared by the row and — where the service has
    // a live position — its map marker.
    const colors = assignColors(shown);
    const trackedTrips = new Set(vehicles.map((v) => v.trip_id));
    const ghostTrips = new Set(ghosts.map((g) => g.trip_id));
    data.__colors = colors;
    data.__vehicles = vehicles;
    data.__ghosts = ghosts;
    data.__hidden = data.departures.length - shown.length;

      const MODES = { 0: "Tram", 1: "Metro", 2: "Train", 3: "Bus", 4: "Ferry" };
      shown.forEach((d) => {
        const row = document.createElement("div");
        const vcolor = colors[d.trip_id];
        const isTracked = trackedTrips.has(d.trip_id);
        const isGhost = ghostTrips.has(d.trip_id);
        // Every row can show its route; a live or estimated one has a marker to
        // ping. (isTracked is kept as its own class for possible styling.)
        row.className = "row" + (isTracked ? " tracked" : "") + (isGhost ? " ghost" : "");
        if (d.trip_id === selectedTrip) row.classList.add("selected");
        row.dataset.trip = d.trip_id;
        row.style.setProperty("--vcolor", vcolor);
        row.tabIndex = 0;
        const activate = () => {
          selectRoute(d.trip_id);
          if ((isTracked || isGhost) && selectedTrip) pingVehicle(d.trip_id);
        };
        row.addEventListener("click", activate);
        row.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); }
        });
        // The badge plate stays black; the glyph and number take the service's
        // colour, matching the row stripe and, when tracked, the map marker.
        const badgeStyle = `style="color:${vcolor}"`;
        const routeLabel = d.route ?? "";
        const numClass = routeLabel.length > 8 ? "num xwide"
                       : routeLabel.length > 4 ? "num wide" : "num";
        const glyph = MODE_EMOJI[d.route_type] ?? DEFAULT_EMOJI;
        // "~" marks a timetable-derived countdown, same mark as the map's
        // estimated labels. (The timeline stays bare — a tilde on every
        // stop time would be noise; its header 🛜/📅 says it once.)
        const eta = d.minutes <= 0
          ? `<div class="due">DUE</div>`
          : `<div class="num">${d.realtime ? "" : "~"}${d.minutes}</div>` +
            `<div class="unit">MIN</div>`;
        const bits = [MODES[d.route_type] ?? ""];
        if (d.platform) bits.push(`Platform ${d.platform}`);
        bits.push(new Date(d.predicted * 1000)
          .toLocaleTimeString([], {hour: "2-digit", minute: "2-digit",
                                   ...(regionTz ? {timeZone: regionTz} : {})}));
        row.innerHTML = `
          <div class="badge" ${badgeStyle}>
            <span class="mode">${asText(glyph)}</span>
            <span class="${numClass}">${routeLabel}</span>
          </div>
          <div class="dest">
            <div class="headsign">${d.headsign ?? ""}</div>
            <div class="sub">${bits.filter(Boolean).join(" · ")}</div>
          </div>
          <div class="src-col">
            <span title="${d.realtime ? "Live Location Feed" : "Scheduled/Estimated"}"
                  >${asText(d.realtime ? MARK_LIVE : MARK_SCHEDULED)}</span>
            ${d.alert_ids && d.alert_ids.length
              ? `<button class="alert-mark" title="Service disruption — click for details"
                         aria-label="Service disruption details">${asText(MARK_ALERT)}</button>`
              : ""}
          </div>
          <div class="eta">${eta}</div>`;
        // The ⚠ opens the disruption popup; it must not also select the row.
        const am = row.querySelector(".alert-mark");
        if (am) am.addEventListener("click", (ev) => {
          ev.stopPropagation();
          showAlerts(d.alert_ids);
        });
        board.appendChild(row);
      });

    // Measure once from a real row, then redraw now that the count is known.
    if (!rowHeight) {
      const first = board.querySelector(".row");
      if (first) {
        rowHeight = first.getBoundingClientRect().height;
        renderBoard(data);
        return;
      }
    }

    // The render wiped #board, and the selected trip's stop list with it.
    lastData = data;                  // renderTripPanel reads lastData
    renderTripPanel();

    const age = data.realtime_feed_age;
    // Three honest states: no feeds configured for this region (no key —
    // waiting would never end), configured but not yet polled, or live.
    const feed = data.realtime_configured === false
      ? "timetable only — no realtime feed configured for this region"
      : age === null
      ? "realtime feed: waiting for first fetch"
      : `realtime feed updated ${age}s ago`;
    $("status").textContent = data.__hidden > 0
      ? `${feed} · ${data.__hidden} more not shown`
      : feed;
  }

  async function refresh() {
    if (hasDest() && (stopId || pinnedBrowse)) return refreshPlan();
    if (!stopId) return;
    try {
      const res = await fetch(api(`/departures/${stopId}`));
      if (!res.ok) throw new Error((await res.json()).detail || res.status);
      const data = await res.json();
      renderBoard(data);
      lastData = data;
      updateMap(data);
      if (selectedTrip) refreshTripTimes(selectedTrip);
    } catch (err) {
      $("board").innerHTML = `<div class="error">${err.message}</div>`;
    }
  }

  // --- planner rendering ---------------------------------------------------
  const planClock = (epoch) => {
    try {
      return new Intl.DateTimeFormat("en-AU", {
        hour: "2-digit", minute: "2-digit", hour12: false,
        timeZone: regionTz || undefined,
      }).format(epoch * 1000);
    } catch { return new Date(epoch * 1000).toTimeString().slice(0, 5); }
  };

  async function refreshPlan() {
    try {
      // Origin: the viewed stop — or, browsing a pinned address, the
      // ADDRESS itself (the server walks it to every stop in range).
      const origin = stopId
        ? `from=${encodeURIComponent(stopId)}`
        : `from_lat=${pinParam.lat}&from_lon=${pinParam.lon}`
          + `&from_label=${encodeURIComponent(pinLabel || "Your address")}`;
      const dest = toId ? `to=${encodeURIComponent(toId)}`
        : `to_lat=${toPoint.lat}&to_lon=${toPoint.lon}`
          + `&to_label=${encodeURIComponent(toName || "Your destination")}`;
      const res = await fetch(api(`/plan?${origin}&${dest}`));
      if (!res.ok) throw new Error((await res.json()).detail || res.status);
      planData = await res.json();
      // Re-cost the started journey: same anchor time -> same legs, with
      // whatever realtime says about them NOW. No match (timetable swapped
      // under us): its last known copy stays frozen rather than vanishing.
      if (startedPlan) {
        try {
          const res2 = await fetch(api(
            `/plan?${origin}&${dest}&at=${startedPlan.at}`));
          if (res2.ok) {
            const d2 = await res2.json();
            const m = d2.itineraries.find((x) => itinKey(x) === startedPlan.key);
            if (m) { startedPlan.itin = m; saveStarted(); }
          }
        } catch { /* keep the frozen copy */ }
      }
      if (planData.to && (!toName || toName === toId)) {
        toName = planData.to.stop_name;
        syncPlanUrl();
        syncChrome();
      }
      // Planner mode owns the map: no departures poll, so no vehicles.
      if (lastData) { lastData.__vehicles = []; lastData.__ghosts = []; }
      renderPlan();
      drawPlan();
      const risky = planData.itineraries.filter((i) => i.at_risk).length;
      $("status").textContent = "journey plan · refreshed just now"
        + (risky ? ` · ⚠ ${risky} connection${risky > 1 ? "s" : ""} at risk` : "");
    } catch (err) {
      $("board").innerHTML = `<div class="error">${err.message}</div>`;
    }
  }

  function renderPlan() {
    const board = $("board");
    board.innerHTML = "";
    const head = document.createElement("div");
    head.className = "board-head";
    const bhName = document.createElement("span");
    bhName.textContent =
      `${planData.from.stop_name} → ${toName || planData.to.stop_name}`;
    head.append(bhName);
    board.appendChild(head);
    // The started journey (if any) is pinned first — a fresh plan may no
    // longer contain it once its departure has passed.
    const fresh = planData.itineraries.filter(
      (it) => !startedPlan || itinKey(it) !== startedPlan.key);
    const shown = startedPlan ? [startedPlan.itin, ...fresh]
                              : planData.itineraries;
    planData.__shown = shown;
    if (selItin >= shown.length) selItin = 0;
    if (!shown.length) {
      board.insertAdjacentHTML("beforeend",
        `<div class="empty">No journeys found from here today.</div>`);
      return;
    }
    // Same colour machinery as the arrivals board: one vehicle colour per
    // service — and a walk IS a service here, performed by a "walk vehicle"
    // (🚶): it draws a colour from the same pool, shared by badge and trace.
    const colorItems = [];
    shown.forEach((it, i) => it.legs.forEach((leg, j) =>
      colorItems.push({ trip_id: leg.kind === "ride" ? leg.trip_id
                                                     : `walk:${i}:${j}` })));
    planData.__colors = assignColors(colorItems);
    shown.forEach((it, i) => {
      const card = document.createElement("div");
      card.className = "itin" + (i === selItin ? " selected" : "");
      card.tabIndex = 0;
      const pick = () => { selItin = i; planFitted = false; renderPlan(); drawPlan(); };
      card.addEventListener("click", pick);
      card.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); }
      });
      // Countdown to set-off (departure minus any leading walk), top right —
      // the same object as an arrivals row's countdown, in the colour of
      // the first thing you must catch (or start walking for).
      let setOff = it.depart;
      for (const l of it.legs) {
        if (l.kind === "ride") break;
        setOff -= l.secs;
      }
      const etaMins = Math.round((setOff - Date.now() / 1000) / 60);
      const firstLeg = it.legs[0];
      const firstColor = planData.__colors[
        firstLeg.kind === "ride" ? firstLeg.trip_id : `walk:${i}:0`] || "#ffb400";
      const eta = document.createElement("div");
      eta.className = "eta it-eta";
      eta.style.setProperty("--vcolor", firstColor);
      eta.innerHTML = etaMins <= 0
        ? `<div class="due">DUE</div>`
        : `<div class="num">${etaMins}</div><div class="unit">MIN</div>`;

      const transfers = it.transfers === 0 ? "direct"
        : it.transfers === 1 ? "1 transfer" : `${it.transfers} transfers`;
      const headRow = document.createElement("div");
      headRow.className = "it-head";
      headRow.innerHTML =
        `<span class="it-times">${planClock(it.depart)} → ${planClock(it.arrive)}</span>` +
        `<span class="it-sub">${it.minutes} min · ${transfers}</span>` +
        (it.at_risk ? `<span class="it-risk">⚠ connection at risk</span>` : "");
      headRow.appendChild(eta);
      card.appendChild(headRow);
      it.legs.forEach((leg, j) => {
        if (leg.kind === "walk") {
          // A walk is a leg like any other: the 🚶 "vehicle", its own pool
          // colour, the same badge/detail layout as a ride.
          const vcolor = planData.__colors[`walk:${i}:${j}`] || "#8c98a4";
          // Times: a walk before a ride is pinned back from that boarding;
          // a TRAILING walk (to the destination) runs on from the last
          // arrival.
          let end = null, start = null;
          for (let k = j + 1; k < it.legs.length; k++) {
            if (it.legs[k].kind === "ride") { end = it.legs[k].dep; break; }
          }
          if (end != null) {
            start = end - leg.secs;
          } else {
            for (let k = j - 1; k >= 0; k--) {
              if (it.legs[k].kind === "ride") { start = it.legs[k].arr; break; }
            }
            if (start != null) end = start + leg.secs;
          }
          const mins = Math.max(1, Math.round(leg.secs / 60));
          const row = document.createElement("div");
          row.className = "it-leg";
          row.style.setProperty("--vcolor", vcolor);
          row.innerHTML = `
            <div class="badge" style="color:${vcolor}">
              <span class="mode">${asText("\u{1F6B6}")}</span>
              <span class="num wide">${mins} min</span>
            </div>
            <div class="it-detail">
              <span>${escapeHtml(leg.from_name ?? "")}</span>
            </div>
            <div class="src-col"></div>
            <div class="it-times2">
              <b>${start != null ? planClock(start) : ""}</b>
            </div>`;
          card.appendChild(row);
          return;
        }
        // A leg is a board row's language: black badge plate with the mode
        // glyph and route in the vehicle colour, 🛜/📅 in the same colour.
        const vcolor = planData.__colors[leg.trip_id] || "#3fb950";
        const row = document.createElement("div");
        row.className = "it-leg";
        row.style.setProperty("--vcolor", vcolor);
        const routeLabel = leg.route ?? "";
        const numClass = routeLabel.length > 8 ? "num xwide"
                       : routeLabel.length > 4 ? "num wide" : "num";
        const glyph = MODE_EMOJI[leg.route_type] ?? DEFAULT_EMOJI;
        // Many feeds bake the platform into the stop name already.
        const plat = (leg.board_platform
                      && !/platform|stop [a-z0-9]/i.test(leg.board_name))
          ? ` · Platform ${leg.board_platform}` : "";
        row.innerHTML = `
          <div class="badge" style="color:${vcolor}">
            <span class="mode">${asText(glyph)}</span>
            <span class="${numClass}">${escapeHtml(routeLabel)}</span>
          </div>
          <div class="it-detail">
            <span>${escapeHtml(leg.board_name)}${plat}</span>
          </div>
          <div class="src-col">
            <span title="${leg.realtime ? "Live Location Feed" : "Scheduled/Estimated"}"
                  >${asText(leg.realtime ? MARK_LIVE : MARK_SCHEDULED)}</span>
          </div>
          <div class="it-times2">
            <b>${planClock(leg.dep)}</b>
          </div>`;
        card.appendChild(row);
      });
      // The journey's arrival — location AND time — is one dedicated row:
      // leg rows describe only departures (a leg's arrival always doubled
      // the next leg's departure).
      const arriveRow = document.createElement("div");
      arriveRow.className = "it-arrive";
      arriveRow.innerHTML =
        `<span>arrive ${escapeHtml(toName || planData.to.stop_name || "")}</span>`
        + `<b>${planClock(it.arrive)}</b>`;
      card.appendChild(arriveRow);

      // Start = commit to this journey (it stops disappearing once its
      // departure passes); the same button on a started journey removes it.
      const isStarted = startedPlan && itinKey(it) === startedPlan.key;
      if (isStarted) card.classList.add("started");
      const act = document.createElement("div");
      act.className = "it-actions";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "it-start" + (isStarted ? " remove" : "");
      btn.textContent = isStarted ? "Remove" : "Start";
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (isStarted) {
          startedPlan = null;
        } else {
          startedPlan = { region, toId: destKey(), key: itinKey(it),
                          at: it.depart - 60, itin: it };
        }
        saveStarted();
        selItin = 0;
        planFitted = false;
        renderPlan();
        drawPlan();
      });
      act.appendChild(btn);
      card.appendChild(act);
      board.appendChild(card);
    });
  }

  let destMarker = null;
  function clearPlanLayers() {
    if (!mapReady) return;
    for (const src of ["routes", "vehicles", "ghosts", "landmarks", "walklines"]) {
      const s = map.getSource(src);
      if (s) s.setData(emptyFC());
    }
    if (destMarker) { destMarker.remove(); destMarker = null; }
  }

  // Walk geometry cache: rounded endpoints -> route points from the local
  // walking graph, or null (no graph / no coverage) = draw a straight dash.
  const walkRouteCache = new Map(), walkRoutePending = new Set();
  const walkKey = (a, b) =>
    [a, b].map((p) => p.map((x) => x.toFixed(5)).join(",")).join("|");
  async function ensureWalkRoute(a, b) {
    const key = walkKey(a, b);
    if (walkRouteCache.has(key) || walkRoutePending.has(key)) return;
    walkRoutePending.add(key);
    try {
      const res = await fetch(
        `/api/walkroute?from_lat=${a[1]}&from_lon=${a[0]}`
        + `&to_lat=${b[1]}&to_lon=${b[0]}`);
      walkRouteCache.set(key, res.ok ? (await res.json()).points : null);
      if (planData) drawPlan();
    } catch {
      walkRouteCache.set(key, null);
    } finally {
      walkRoutePending.delete(key);
    }
  }

  // Cut a trip's full shape down to the ridden slice: nearest shape vertex
  // to the boarding stop, then nearest vertex to the alighting stop AFTER it
  // (shapes follow travel direction — searching forward keeps loops honest).
  function sliceShapeBetween(pts, a, b) {
    const coslat = Math.cos((a[1] * Math.PI) / 180) ** 2;
    const nearest = (p, from) => {
      let bi = from, bd = Infinity;
      for (let i = from; i < pts.length; i++) {
        const dx = pts[i][0] - p[0], dy = pts[i][1] - p[1];
        const d = dx * dx * coslat + dy * dy;
        if (d < bd) { bd = d; bi = i; }
      }
      return bi;
    };
    const i = nearest(a, 0);
    const j = nearest(b, i);
    return j > i ? pts.slice(i, j + 1) : null;
  }

  // The selected itinerary on the map: each ride leg drawn along its trip's
  // REAL shape, sliced between board and alight (falling back to
  // stop-to-stop lines while the shape loads, or if the trip has none);
  // transfer points as landmarks, the destination as a green marker.
  function drawPlan() {
    if (!mapReady || !planData || !hasDest()) return;
    const it = (planData.__shown || planData.itineraries)[selItin];
    if (!it) { clearPlanLayers(); return; }
    const lines = [], marks = [];
    let waiting = false;
    for (const leg of it.legs) {
      if (leg.kind !== "ride") continue;
      const stops = tripStopsCache.get(leg.trip_id);
      if (!stops) { ensureTripStops(leg.trip_id); waiting = true; continue; }
      const bi = stops.findIndex((s) => s.stop_id === leg.board);
      const ai = stops.findIndex((s) => s.stop_id === leg.alight);
      if (bi < 0 || ai < 0) continue;
      const seg = stops.slice(Math.min(bi, ai), Math.max(bi, ai) + 1);
      let coords = seg.map((s) => [s.lon, s.lat]);
      if (leg.shape_id) {
        const pts = shapeCache.get(leg.shape_id);
        if (pts === undefined) { ensureShape(leg.shape_id, region); waiting = true; }
        else if (pts && pts.length > 1) {
          const sliced = sliceShapeBetween(
            pts, coords[0], coords[coords.length - 1]);
          if (sliced && sliced.length > 1) coords = sliced;
        }
      }
      lines.push({
        type: "Feature",
        geometry: { type: "LineString", coordinates: coords },
        // Same vehicle colour as the leg's badge — board and map agree.
        properties: { color: (planData.__colors || {})[leg.trip_id] || "#3fb950" },
      });
      for (const end of [seg[0], seg[seg.length - 1]]) {
        marks.push({
          type: "Feature",
          geometry: { type: "Point", coordinates: [end.lon, end.lat] },
          properties: {
            stop_id: end.stop_id, name: end.stop_name,
            icon: ensureVehicleIcon(landmarkGlyph(end.route_type), LANDMARK_INK),
          },
        });
      }
    }
    map.getSource("routes").setData({ type: "FeatureCollection", features: lines });
    map.getSource("landmarks").setData({ type: "FeatureCollection", features: marks });
    map.getSource("vehicles").setData(emptyFC());
    map.getSource("ghosts").setData(emptyFC());

    // Walks are the gaps between rides: origin -> first board, alight ->
    // next board. Drawn dashed along the walking graph, in the SAME pool
    // colour as the walk leg's badge — the walk is a vehicle here.
    const walks = [];
    let cursor = (planData.from && planData.from.stop_lat != null)
      ? [planData.from.stop_lon, planData.from.stop_lat] : null;
    let gapWalkIdx = null;
    it.legs.forEach((leg, j) => {
      if (leg.kind === "walk") { if (gapWalkIdx === null) gapWalkIdx = j; return; }
      if (cursor && leg.board_lat != null) {
        const b = [leg.board_lon, leg.board_lat];
        const dm = Math.hypot((b[0] - cursor[0]) * 88000,
                              (b[1] - cursor[1]) * 111000);
        if (dm > 25) {   // sub-25 m "walks" are platform hops, not journeys
          const key = walkKey(cursor, b);
          let pts = walkRouteCache.get(key);
          if (pts === undefined) { ensureWalkRoute(cursor, b); pts = null; }
          walks.push({
            type: "Feature",
            geometry: { type: "LineString",
                        coordinates: pts || [cursor, b] },
            properties: {
              color: gapWalkIdx !== null
                ? (planData.__colors || {})[`walk:${selItin}:${gapWalkIdx}`]
                : undefined,
            },
          });
        }
      }
      if (leg.alight_lat != null) cursor = [leg.alight_lon, leg.alight_lat];
      gapWalkIdx = null;
    });
    // A TRAILING walk (last leg, no ride after it) ends at the destination.
    if (gapWalkIdx !== null && cursor && planData.to
        && planData.to.stop_lat != null) {
      const b = [planData.to.stop_lon, planData.to.stop_lat];
      const dm = Math.hypot((b[0] - cursor[0]) * 88000,
                            (b[1] - cursor[1]) * 111000);
      if (dm > 25) {
        const key = walkKey(cursor, b);
        let pts = walkRouteCache.get(key);
        if (pts === undefined) { ensureWalkRoute(cursor, b); pts = null; }
        walks.push({
          type: "Feature",
          geometry: { type: "LineString", coordinates: pts || [cursor, b] },
          properties: {
            color: (planData.__colors || {})[`walk:${selItin}:${gapWalkIdx}`],
          },
        });
      }
    }
    map.getSource("walklines").setData(
      { type: "FeatureCollection", features: walks });
    if (!destMarker && planData.to
        && planData.to.stop_lat != null && planData.to.stop_lon != null) {
      destMarker = new maplibregl.Marker({ color: "#2ecc71" })
        .setLngLat([planData.to.stop_lon, planData.to.stop_lat]).addTo(map);
    }
    if (!planFitted && lines.length && !waiting) {
      const b = new maplibregl.LngLatBounds();
      for (const l of lines) for (const c of l.geometry.coordinates) b.extend(c);
      if (pinParam) b.extend([pinParam.lon, pinParam.lat]);  // the front door
      cameraMove(() => map.fitBounds(b, { padding: 70, maxZoom: 15.5 }));
      planFitted = true;
    }
  }

  // Re-fit the board when the viewport changes; the row count is derived from
  // available height, so a resize or an orientation change alters it.
  let resizeDebounce;
  window.addEventListener("resize", () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => {
      fitResults();
      if (!lastData) return;
      renderBoard(lastData);
      updateMap(lastData);
    }, 150);
  });

  syncChrome();
  initMap();
  if (stopId) selectStop(stopId);
  else if (hasDest() && pinnedBrowse) {
    // A reloaded/shared address-origin plan: start polling it directly.
    refresh();
    timer = setInterval(refresh, 15000);
  }
  // ?q= deep-links a search: prefill the box and run it as if typed.
  const preQ = new URLSearchParams(location.search).get("q");
  if (preQ && !stopId) {
    const inp = $("search");
    inp.value = preQ;
    inp.dispatchEvent(new Event("input", { bubbles: true }));
  }
</script>
</body>
</html>
