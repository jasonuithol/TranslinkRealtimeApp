# Serving region packs the way a GitHub release does, for local testing.
#
# Flat filenames (build_pack.py --dist lays them out that way), byte
# ranges, and the one header GitHub does NOT send: Access-Control-Allow-
# Origin. A browser cannot fetch release assets cross-origin without it,
# so testing the download path locally needs a mirror that does.
server {
  listen 80;
  root /usr/share/nginx/html;
  location / {
    add_header Access-Control-Allow-Origin *;
    add_header Accept-Ranges bytes;
    autoindex on;
  }
}
